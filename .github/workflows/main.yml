name: Build PCSX-ReARMed Single-Core LTO Cortex-A9

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install ARMv7 Cross-Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf git make

      - name: Checkout and Patch for Single-Core Cortex-A9
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout d2b40c8
          git submodule update --init
          # 1. Force -O3 everywhere
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile
          # 2. Remove THREAD_RENDERING overhead for single-core CPU
          sed -i 's/THREAD_RENDERING = 1/THREAD_RENDERING = 0/g' Makefile.libretro
          sed -i 's/-DTHREAD_RENDERING//g' Makefile.libretro
          sed -i 's/plugins\/gpulib\/gpulib_thread_if.o//g' Makefile

      - name: Build Cortex-A9 LTO (hardfp ABI)
        run: |
          cd src
          find . -name "*.o" -delete
          rm -f pcsx_rearmed_libretro.so
          OPT_FLAGS="-mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=hard -O3 -flto -funroll-loops -fomit-frame-pointer -ffast-math -fstrict-aliasing -DNDEBUG -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector"
          
          export CFLAGS="$OPT_FLAGS"
          export CXXFLAGS="$OPT_FLAGS"
          export LDFLAGS="-flto $OPT_FLAGS"
          export ASFLAGS="-mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=hard"
          
          make -f Makefile.libretro \
            platform=unix \
            ARCH=arm \
            DYNAREC=ari64 \
            HAVE_NEON=0 \
            HAVE_VFP=1 \
            HAVE_CHD=1 \
            THREAD_RENDERING=0 \
            BUILTIN_GPU=unai \
            CC="arm-linux-gnueabihf-gcc $OPT_FLAGS" \
            CXX="arm-linux-gnueabihf-g++ $OPT_FLAGS" \
            AS="arm-linux-gnueabihf-as -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=hard" \
            AR=arm-linux-gnueabihf-gcc-ar \
            -j2 2>&1 | tee ../build_hardfp_lto.log
          arm-linux-gnueabihf-strip --strip-unneeded pcsx_rearmed_libretro.so
          cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro_hardfp_lto.so

      - name: Package .so File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-singlecore-lto
          path: |
            pcsx_rearmed_libretro_hardfp_lto.so
            build_hardfp_lto.log
