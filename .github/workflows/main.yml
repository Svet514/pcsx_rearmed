name: Build PCSX-ReARMed v10 Official b1226a3a + scph5502 BIOS + Clean Audio

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Official b1226a3a & Add scph5502.bin BIOS + Clean XA Fix
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src

          # Checkout official August 22, 2021 Libretro merge commit (no submodules needed!)
          git checkout b1226a3ab49a2e82e55a7123eb68fded56091044

          # 1. Add scph5502.bin (your PAL BIOS in /roms/scph5502.bin!) to frontend/libretro.c so it never falls back to buggy HLE BIOS!
          sed -i 's/"scph5501.bin"/"scph5502.bin", "scph5501.bin"/g' frontend/libretro.c

          # 2. In libpcsxcore/cdrom.c:
          # When (cdr.Mode & MODE_SF) == 0 (unfiltered XA cutscene like Blue's Clues), allow valid non-255 audio sectors
          # to update cdr.File and cdr.Channel even after FirstSector becomes 0 at 00:29, while keeping MODE_SF != 0 (Sesame Street) 100% strict!
          sed -i 's/if( cdr.FirstSector == 1 && (cdr.Mode & MODE_SF)==0 )/if( (cdr.Mode \& MODE_SF)==0 \&\& (cdr.Transfer[4 + 2] \& 0x4) \&\& cdr.Transfer[4 + 1] != 255 )/g' libpcsxcore/cdrom.c

          # 3. Upgrade -O2 to -O3 and add static C++ linking + -Wl,-Bsymbolic
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile

          echo "=== VERIFIED GIT DIFF FOR V10 ===" > ../build_v10_report.txt
          git diff frontend/libretro.c libpcsxcore/cdrom.c >> ../build_v10_report.txt
          cat ../build_v10_report.txt

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            # Cortex-A9 r2p9 flags with -mno-unaligned-access (prevents kernel alignment traps seen in /proc/cpu/alignment)
            A9_V10_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -fno-tree-vectorize -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fgcse-sm -fgcse-las -fipa-pta -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$A9_V10_FLAGS"
            export CXXFLAGS="$A9_V10_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $A9_V10_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $A9_V10_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_v10.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
            ls -lh ../pcsx_rearmed_libretro.so >> ../build_v10_report.txt
          '
          cat build_v10_report.txt

      - name: Upload v10 .so File & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-v10-official-scph5502
          path: |
            pcsx_rearmed_libretro.so
            build_v10_report.txt
            build_v10.log
