name: Build PCSX-ReARMed v39

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout b1226a3a, Clone rtissera/libchdr (Zstd), & Apply V39 Patches
        run: |
          set -eo pipefail
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout b1226a3ab49a2e82e55a7123eb68fded56091044

          # 1. Preserve zlib-1.2.11 from b1226a3a, clone latest rtissera/libchdr (with Zstd/cdzs), and restore zlib-1.2.11
          cp -r deps/libchdr/deps/zlib-1.2.11 /tmp/zlib-1.2.11
          rm -rf deps/libchdr
          git clone --depth 1 https://github.com/rtissera/libchdr.git deps/libchdr
          cp -r /tmp/zlib-1.2.11 deps/libchdr/deps/zlib-1.2.11

          # 2. Add scph5502.bin to BIOS list
          sed -i 's/"scph5501.bin"/"scph5502.bin", "scph5501.bin"/g' frontend/libretro.c

          cat << 'EOF' > patch_v39.py
          import sys
          import os
          import re
          import glob

          # --- 0. PATCH Makefile TO BUILD rtissera/libchdr WITH FAST ARMv7 UNALIGNED ZSTD (cdzs) ---
          with open("Makefile", "r") as f:
              cur_mk = f.read()

          start_marker = '# libchdr\nifeq "$(HAVE_CHD)" "1"'
          if start_marker not in cur_mk:
              print("ERROR: Could not locate HAVE_CHD block in Makefile!")
              sys.exit(1)

          c_start = cur_mk.index(start_marker)
          c_end = cur_mk.index("endif\n", c_start) + len("endif\n")

          lzma_dirs = sorted(glob.glob("deps/libchdr/deps/lzma-*"))
          zstd_dirs = sorted(glob.glob("deps/libchdr/deps/zstd-*"))
          if not lzma_dirs or not zstd_dirs:
              print("ERROR: Could not find lzma-* or zstd-* inside deps/libchdr/deps/!")
              sys.exit(1)

          lzma_dir = lzma_dirs[0]
          zstd_dir = zstd_dirs[0]

          inc_dirs = ["deps/libchdr/include", "deps/libchdr/include/libchdr", "deps/libchdr/src", f"{lzma_dir}/include", zstd_dir, "deps/libchdr/deps/zlib-1.2.11"]
          for root, dirs, files in os.walk("deps/libchdr/deps"):
              if any(f.endswith(".h") for f in files) and root not in inc_dirs:
                  inc_dirs.append(root)

          chd_sources = sorted(glob.glob("deps/libchdr/src/*.c"))
          zlib_sources = sorted(glob.glob("deps/libchdr/deps/zlib-1.2.11/*.c"))
          lzma_sources = [f"{lzma_dir}/src/LzmaDec.c"]
          if os.path.exists(f"{lzma_dir}/src/CpuArch.c"):
              lzma_sources.append(f"{lzma_dir}/src/CpuArch.c")

          zstd_sources = []
          if os.path.exists(f"{zstd_dir}/zstddeclib.c"):
              zstd_sources.append(f"{zstd_dir}/zstddeclib.c")
          else:
              zstd_sources.extend(sorted(glob.glob(f"{zstd_dir}/common/*.c")))
              zstd_sources.extend(sorted(glob.glob(f"{zstd_dir}/decompress/*.c")))

          all_chd_c = chd_sources + lzma_sources + zstd_sources + zlib_sources
          inc_flags = " ".join(f"-I{d}" for d in inc_dirs)
          obj_list = " \\\n\t".join(src[:-2] + ".o" for src in all_chd_c)

          new_chd_block = (
              '# libchdr\n'
              'ifeq "$(HAVE_CHD)" "1"\n'
              f'CFLAGS += {inc_flags} -DHAVE_CHD -D_7ZIP_ST -DCHDR_SYSTEM_ZLIB\n'
              f'CHD_OBJS = {obj_list}\n'
              '$(CHD_OBJS): CFLAGS += -munaligned-access -Wno-unused -Wno-unused-function -Wno-deprecated-declarations\n'
              'OBJS += $(CHD_OBJS)\n'
              'endif\n'
          )

          cur_mk = cur_mk[:c_start] + new_chd_block + cur_mk[c_end:]
          with open("Makefile", "w") as f:
              f.write(cur_mk)
          print(f"SUCCESS 0: Configured Makefile with {len(all_chd_c)} CHD/Zstd files + hardware -munaligned-access!")

          # --- 1. CREATE include/pcsx_telemetry.h SHARED TELEMETRY STRUCT ---
          telemetry_h = "\n".join([
              "#ifndef PCSX_TELEMETRY_H",
              "#define PCSX_TELEMETRY_H",
              "#include <stdint.h>",
              "",
              "struct pcsx_telem_s {",
              "    uint32_t frame_cd_reads;",
              "    uint32_t frame_cd_us;",
              "    uint32_t last_cd_lba;",
              "    uint32_t frame_xa_sectors;",
              "",
              "    uint32_t frame_gpu_us;",
              "    uint32_t frame_poly_total;",
              "    uint32_t frame_poly_light;",
              "    uint32_t frame_poly_blend;",
              "    uint32_t frame_poly_tex;",
              "    uint32_t frame_sprites;",
              "    uint32_t frame_vram_writes;",
              "",
              "    uint32_t frame_spu_us;",
              "    uint32_t frame_feed_us;",
              "    uint32_t frame_spu_samples;",
              "    uint32_t frame_spu_div;",
              "    uint32_t frame_xa_active;",
              "};",
              "",
              "extern struct pcsx_telem_s g_telem;",
              "#endif",
              ""
          ])
          with open("include/pcsx_telemetry.h", "w") as f:
              f.write(telemetry_h)
          print("SUCCESS 1A: Created include/pcsx_telemetry.h!")

          # --- 2. PATCH plugins/dfsound/spu.c: EXACT V27 AUDIO + SAFE SPU/XA TELEMETRY ---
          with open("plugins/dfsound/spu.c", "r") as f:
              spu_c = f.read()

          spu_header = (
              "#include <sys/time.h>\n"
              "#include \"pcsx_telemetry.h\"\n"
              "struct pcsx_telem_s g_telem;\n"
              "static int g_spu_div = 768;\n"
          )

          old_ns_calc = (
              " if (cycle_diff < 2 * 768)\n"
              "  return;\n"
              "\n"
              " ns_to = (cycle_diff / 768 + 1) & ~1;"
          )
          new_ns_calc = (
              " if (cycle_diff < 2 * g_spu_div)\n"
              "  return;\n"
              "\n"
              " ns_to = (cycle_diff / g_spu_div + 1) & ~1;"
          )

          old_played_adv = "  spu.cycles_played += ns_to * 768;"
          new_played_adv = "  spu.cycles_played += ns_to * g_spu_div;"

          old_async_start = "void CALLBACK SPUasync(unsigned int cycle, unsigned int flags)\n{"
          new_async_start = (
              "void CALLBACK SPUasync(unsigned int cycle, unsigned int flags)\n{\n"
              " struct timeval t_spu0, t_spu1;\n"
              " gettimeofday(&t_spu0, NULL);"
          )

          old_async_feed = (
              " if (flags & 1) {\n"
              "  out_current->feed(spu.pSpuBuffer, (unsigned char *)spu.pS - spu.pSpuBuffer);\n"
              "  spu.pS = (short *)spu.pSpuBuffer;"
          )
          new_async_feed = "\n".join([
              " gettimeofday(&t_spu1, NULL);",
              " g_telem.frame_spu_us += (t_spu1.tv_sec - t_spu0.tv_sec) * 1000000 + (t_spu1.tv_usec - t_spu0.tv_usec);",
              " if (flags & 1) {",
              "  static struct timeval after_feed_tv = {0, 0};",
              "  struct timeval before_feed_tv;",
              "  gettimeofday(&before_feed_tv, NULL);",
              "  if (spu.XAPlay != spu.XAFeed) {",
              "   g_spu_div = 768;",
              "  } else if (after_feed_tv.tv_sec != 0) {",
              "   long emu_us = (before_feed_tv.tv_sec - after_feed_tv.tv_sec) * 1000000L + (before_feed_tv.tv_usec - after_feed_tv.tv_usec);",
              "   if (emu_us > 21200) g_spu_div = 748;",
              "   else if (emu_us > 19600) g_spu_div = 784;",
              "   else g_spu_div = 824;",
              "  }",
              "  int bytes_to_feed = (unsigned char *)spu.pS - spu.pSpuBuffer;",
              "  g_telem.frame_spu_samples = bytes_to_feed >> 2;",
              "  g_telem.frame_spu_div = g_spu_div;",
              "  g_telem.frame_xa_active = (spu.XAPlay != spu.XAFeed) ? 1 : 0;",
              "  out_current->feed(spu.pSpuBuffer, bytes_to_feed);",
              "  spu.pS = (short *)spu.pSpuBuffer;",
              "  gettimeofday(&after_feed_tv, NULL);",
              "  g_telem.frame_feed_us += (after_feed_tv.tv_sec - before_feed_tv.tv_sec) * 1000000 + (after_feed_tv.tv_usec - before_feed_tv.tv_usec);"
          ])

          old_feed_xa = " FeedXA(xap);"
          new_feed_xa = "\n".join([
              " g_telem.frame_xa_sectors++;",
              " if (spu.iLeftXAVol < 0x2000 && spu.iRightXAVol < 0x2000) { spu.iLeftXAVol = 0x7fff; spu.iRightXAVol = 0x7fff; }",
              " spu.spuCtrl |= 0xc001;",
              " FeedXA(xap);"
          ])

          if old_ns_calc not in spu_c or old_played_adv not in spu_c or old_async_start not in spu_c or old_async_feed not in spu_c or old_feed_xa not in spu_c:
              print("ERROR: target blocks not found in spu.c!")
              sys.exit(1)

          spu_c = (
              spu_header + spu_c
              .replace(old_ns_calc, new_ns_calc, 1)
              .replace(old_played_adv, new_played_adv, 1)
              .replace(old_async_start, new_async_start, 1)
              .replace(old_async_feed, new_async_feed, 1)
              .replace(old_feed_xa, new_feed_xa, 1)
          )
          with open("plugins/dfsound/spu.c", "w") as f:
              f.write(spu_c)
          print("SUCCESS 2: Cleanly patched plugins/dfsound/spu.c (Exact V27 logic + telemetry)!")

          # --- 3. PATCH libpcsxcore/cdrom.c & cdriso.c: CDROM FIX + CHD READ TIMING TELEMETRY ---
          with open("libpcsxcore/cdrom.c", "r") as f:
              cdrom = f.read()

          old_lock = (
              "\t\tif( cdr.FirstSector == 1 && (cdr.Mode & MODE_SF)==0 ) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t}"
          )
          new_lock = (
              "\t\tif (cdr.FirstSector == 1 && (cdr.Mode & MODE_SF) == 0 && (cdr.Transfer[4 + 2] & 0x4) && cdr.Transfer[4 + 1] != 255) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t}"
          )

          if old_lock not in cdrom:
              print("ERROR: old_lock not found in cdrom.c!")
              sys.exit(1)

          cdrom = cdrom.replace(old_lock, new_lock, 1)
          with open("libpcsxcore/cdrom.c", "w") as f:
              f.write(cdrom)

          with open("libpcsxcore/cdriso.c", "r") as f:
              cdriso = f.read()

          cdriso_hdr = (
              "#include <sys/time.h>\n"
              "#include \"pcsx_telemetry.h\"\n"
          )

          if "chd_read(" in cdriso:
              cdriso_hdr += (
                  "#include <libchdr/chd.h>\n"
                  "static inline chd_error telem_chd_read(chd_file *file, uint32_t hunknum, void *buffer) {\n"
                  "    struct timeval t0, t1;\n"
                  "    gettimeofday(&t0, NULL);\n"
                  "    g_telem.frame_cd_reads++;\n"
                  "    g_telem.last_cd_lba = hunknum;\n"
                  "    chd_error err = chd_read(file, hunknum, buffer);\n"
                  "    gettimeofday(&t1, NULL);\n"
                  "    g_telem.frame_cd_us += (t1.tv_sec - t0.tv_sec) * 1000000 + (t1.tv_usec - t0.tv_usec);\n"
                  "    return err;\n"
                  "}\n"
              )
              cdriso = cdriso_hdr + cdriso.replace("chd_read(", "telem_chd_read(")
              with open("libpcsxcore/cdriso.c", "w") as f:
                  f.write(cdriso)
              print("SUCCESS 3: Patched libpcsxcore/cdrom.c & wrapped chd_read() in cdriso.c for Zstd timing!")
          else:
              print("ERROR: chd_read( not found in cdriso.c!")
              sys.exit(1)

          # --- 4. PATCH plugins/gpu_unai/gpulib_if.cpp: C++ RAII SCOPE TIMER + PRIMITIVE TELEMETRY ---
          with open("plugins/gpu_unai/gpulib_if.cpp", "r") as f:
              gpulib_if = f.read()

          gpu_hdr = "\n".join([
              '#include <stddef.h>',
              '#include <sys/time.h>',
              'extern "C" {',
              '#include "pcsx_telemetry.h"',
              '}',
              'struct gpu_telem_scope_timer {',
              '    struct timeval t0;',
              '    gpu_telem_scope_timer() { gettimeofday(&t0, 0); }',
              '    ~gpu_telem_scope_timer() {',
              '        struct timeval t1;',
              '        gettimeofday(&t1, 0);',
              '        g_telem.frame_gpu_us += (t1.tv_sec - t0.tv_sec) * 1000000 + (t1.tv_usec - t0.tv_usec);',
              '    }',
              '};',
              ''
          ])

          m_start = re.search(r"int\s+do_cmd_list\s*\([^)]*\)\s*\{", gpulib_if)
          m_switch = re.search(r"switch\s*\(\s*cmd\s*\)\s*\{", gpulib_if)

          if not m_start or not m_switch:
              print(f"ERROR: Regex match failed in gpulib_if.cpp! start={bool(m_start)} switch={bool(m_switch)}")
              sys.exit(1)

          orig_start = m_start.group(0)
          orig_switch = m_switch.group(0)

          new_cmd_start = orig_start + "\n\tgpu_telem_scope_timer _gpu_timer;\n"
          new_switch = (
              "if (cmd >= 0x20 && cmd < 0x40) {\n"
              "\t\tg_telem.frame_poly_total++;\n"
              "\t\tif (cmd & 0x02) g_telem.frame_poly_blend++;\n"
              "\t\tif (cmd & 0x04) {\n"
              "\t\t\tg_telem.frame_poly_tex++;\n"
              "\t\t\tif (!(cmd & 0x01)) g_telem.frame_poly_light++;\n"
              "\t\t} else if (cmd & 0x10) {\n"
              "\t\t\tg_telem.frame_poly_light++;\n"
              "\t\t}\n"
              "\t} else if (cmd >= 0x60 && cmd < 0x80) {\n"
              "\t\tg_telem.frame_sprites++;\n"
              "\t\tif (cmd & 0x02) g_telem.frame_poly_blend++;\n"
              "\t\tif ((cmd & 0x04) && !(cmd & 0x01)) g_telem.frame_poly_light++;\n"
              "\t} else if (cmd >= 0x80 && cmd < 0xC0) {\n"
              "\t\tg_telem.frame_vram_writes++;\n"
              "\t}\n\t" + orig_switch
          )

          gpulib_if = (
              gpu_hdr + gpulib_if
              .replace(orig_start, new_cmd_start, 1)
              .replace(orig_switch, new_switch, 1)
          )
          with open("plugins/gpu_unai/gpulib_if.cpp", "w") as f:
              f.write(gpulib_if)
          print("SUCCESS 4: Patched plugins/gpu_unai/gpulib_if.cpp with RAII scope timer & polygon/lighting/blending/sprite telemetry!")

          # --- 5. PATCH frontend/libretro.c: SESAME LIGHTING + /tmp/pcsx_telemetry.log LOGGER ---
          with open("frontend/libretro.c", "r") as f:
              libretro_c = f.read()

          target_load_game = "bool retro_load_game(const struct retro_game_info *info)\n{"
          target_lighting_block = (
              '   var.key = "pcsx_rearmed_gpu_unai_lighting";\n'
              '   var.value = NULL;\n'
              '\n'
              '   if (environ_cb(RETRO_ENVIRONMENT_GET_VARIABLE, &var) && var.value)\n'
              '   {\n'
              '      if (strcmp(var.value, "disabled") == 0)\n'
              '         pl_rearmed_cbs.gpu_unai.lighting = 0;\n'
              '      else if (strcmp(var.value, "enabled") == 0)\n'
              '         pl_rearmed_cbs.gpu_unai.lighting = 1;\n'
              '   }'
          )
          m_retro_run = re.search(r"void\s+retro_run\s*\(\s*void\s*\)\s*\{", libretro_c)

          if target_load_game not in libretro_c or target_lighting_block not in libretro_c or not m_retro_run:
              print(f"ERROR: target blocks not found in frontend/libretro.c! load={target_load_game in libretro_c} light={target_lighting_block in libretro_c} run={bool(m_retro_run)}")
              sys.exit(1)

          orig_retro_run = m_retro_run.group(0)

          new_load_game = "\n".join([
              "#include <sys/time.h>",
              "#include \"pcsx_telemetry.h\"",
              "static int g_is_sesame = 0;",
              "static FILE *g_tlog = NULL;",
              "static uint32_t g_frame_no = 0;",
              "static struct timeval g_prev_f_tv = {0, 0};",
              "static struct timeval g_sec_tv = {0, 0};",
              "bool retro_load_game(const struct retro_game_info *info)",
              "{",
              "   g_is_sesame = (info && info->path && strstr(info->path, \"Sesame Street Sports\") != NULL) ? 1 : 0;",
              "   if (g_tlog) { fclose(g_tlog); g_tlog = NULL; }",
              "   g_tlog = fopen(\"/tmp/pcsx_telemetry.log\", \"w\");",
              "   g_frame_no = 0;",
              "   g_prev_f_tv.tv_sec = 0; g_prev_f_tv.tv_usec = 0;",
              "   g_sec_tv.tv_sec = 0; g_sec_tv.tv_usec = 0;",
              "   if (g_tlog) {",
              "      fprintf(g_tlog, \"=== PCSX-ReARMed V39 Telemetry Started ===\\nGame: %s\\n\", (info && info->path) ? info->path : \"unknown\");",
              "      fprintf(g_tlog, \"Columns: [SEC] fps | min_fps(max_ms) | avg_cpu_us avg_gpu_us avg_spu_us avg_feed_us avg_cd_us | polys(light/blend/tex) sprites vram_w | chd_hunks(last_hunk) xa_sect | spu_div xa_on unai_light\\n\");",
              "      fflush(g_tlog);",
              "   }"
          ])

          new_lighting_block = "\n".join([
              '   var.key = "pcsx_rearmed_gpu_unai_lighting";',
              '   var.value = NULL;',
              '',
              '   if (environ_cb(RETRO_ENVIRONMENT_GET_VARIABLE, &var) && var.value)',
              '   {',
              '      if (strcmp(var.value, "disabled") == 0 || g_is_sesame || strncasecmp(CdromId, "sles03180", 9) == 0 || strncasecmp(CdromId, "slus01180", 9) == 0)',
              '         pl_rearmed_cbs.gpu_unai.lighting = 0;',
              '      else if (strcmp(var.value, "enabled") == 0)',
              '         pl_rearmed_cbs.gpu_unai.lighting = 1;',
              '   }'
          ])

          new_retro_run = "\n".join([
              "static void telem_step_frame(void) {",
              "   static uint32_t sec_frames = 0, sec_max_us = 0;",
              "   static uint64_t sum_cpu = 0, sum_gpu = 0, sum_spu = 0, sum_feed = 0, sum_cd = 0;",
              "   static uint32_t sum_ptot = 0, sum_plight = 0, sum_pblend = 0, sum_ptex = 0, sum_spr = 0, sum_vram = 0, sum_cdr = 0, sum_xas = 0;",
              "   struct timeval now_tv;",
              "   gettimeofday(&now_tv, NULL);",
              "   if (g_prev_f_tv.tv_sec != 0) {",
              "      g_frame_no++;",
              "      uint32_t f_us = (now_tv.tv_sec - g_prev_f_tv.tv_sec) * 1000000 + (now_tv.tv_usec - g_prev_f_tv.tv_usec);",
              "      uint32_t sub_us = g_telem.frame_gpu_us + g_telem.frame_spu_us + g_telem.frame_feed_us + g_telem.frame_cd_us;",
              "      uint32_t cpu_us = (f_us > sub_us) ? (f_us - sub_us) : 0;",
              "      sec_frames++;",
              "      if (f_us > sec_max_us) sec_max_us = f_us;",
              "      sum_cpu += cpu_us; sum_gpu += g_telem.frame_gpu_us; sum_spu += g_telem.frame_spu_us;",
              "      sum_feed += g_telem.frame_feed_us; sum_cd += g_telem.frame_cd_us;",
              "      sum_ptot += g_telem.frame_poly_total; sum_plight += g_telem.frame_poly_light;",
              "      sum_pblend += g_telem.frame_poly_blend; sum_ptex += g_telem.frame_poly_tex;",
              "      sum_spr += g_telem.frame_sprites; sum_vram += g_telem.frame_vram_writes;",
              "      sum_cdr += g_telem.frame_cd_reads; sum_xas += g_telem.frame_xa_sectors;",
              "      if (g_tlog && f_us > 22500 && g_frame_no > 30) {",
              "         fprintf(g_tlog, \"  [SLOW_FRAME #%u] %.1f fps (%u.%u ms) | cpu=%u gpu=%u spu=%u feed=%u cd=%u us | poly=%u(L:%u B:%u T:%u) spr=%u vram=%u | chd_rd=%u(hunk:%u) xa_s=%u | div=%u samples=%u xa=%u res=%dx%d\\n\",",
              "            g_frame_no, 1000000.0 / (double)f_us, f_us / 1000, (f_us % 1000) / 100,",
              "            cpu_us, g_telem.frame_gpu_us, g_telem.frame_spu_us, g_telem.frame_feed_us, g_telem.frame_cd_us,",
              "            g_telem.frame_poly_total, g_telem.frame_poly_light, g_telem.frame_poly_blend, g_telem.frame_poly_tex,",
              "            g_telem.frame_sprites, g_telem.frame_vram_writes,",
              "            g_telem.frame_cd_reads, g_telem.last_cd_lba, g_telem.frame_xa_sectors,",
              "            g_telem.frame_spu_div, g_telem.frame_spu_samples, g_telem.frame_xa_active, pl_vout_w, pl_vout_h);",
              "      }",
              "      long elapsed_us = (now_tv.tv_sec - g_sec_tv.tv_sec) * 1000000L + (now_tv.tv_usec - g_sec_tv.tv_usec);",
              "      if (elapsed_us >= 1000000L && sec_frames > 0) {",
              "         if (g_tlog) {",
              "            double fps = (double)sec_frames * 1000000.0 / (double)elapsed_us;",
              "            double min_fps = (sec_max_us > 0) ? (1000000.0 / (double)sec_max_us) : 0.0;",
              "            fprintf(g_tlog, \"[1S f=%u ID=%s] %.1f fps | min %.1f fps (%u.%u ms) | avg_us: cpu=%u gpu=%u spu=%u feed=%u cd=%u | avg_draw: poly=%u(L:%u B:%u T:%u) spr=%u vram=%u | chd_rd=%u(hunk:%u) xa_s=%u | div=%u xa=%u light=%d\\n\",",
              "               g_frame_no, CdromId[0] ? CdromId : \"none\", fps, min_fps, sec_max_us / 1000, (sec_max_us % 1000) / 100,",
              "               (uint32_t)(sum_cpu / sec_frames), (uint32_t)(sum_gpu / sec_frames), (uint32_t)(sum_spu / sec_frames),",
              "               (uint32_t)(sum_feed / sec_frames), (uint32_t)(sum_cd / sec_frames),",
              "               sum_ptot / sec_frames, sum_plight / sec_frames, sum_pblend / sec_frames, sum_ptex / sec_frames,",
              "               sum_spr / sec_frames, sum_vram / sec_frames, sum_cdr, g_telem.last_cd_lba, sum_xas,",
              "               g_telem.frame_spu_div, g_telem.frame_xa_active, pl_rearmed_cbs.gpu_unai.lighting);",
              "            fflush(g_tlog);",
              "         }",
              "         g_sec_tv = now_tv; sec_frames = 0; sec_max_us = 0;",
              "         sum_cpu = sum_gpu = sum_spu = sum_feed = sum_cd = 0;",
              "         sum_ptot = sum_plight = sum_pblend = sum_ptex = sum_spr = sum_vram = sum_cdr = sum_xas = 0;",
              "      }",
              "   } else {",
              "      g_sec_tv = now_tv;",
              "      sec_frames = 0; sec_max_us = 0;",
              "      sum_cpu = sum_gpu = sum_spu = sum_feed = sum_cd = 0;",
              "      sum_ptot = sum_plight = sum_pblend = sum_ptex = sum_spr = sum_vram = sum_cdr = sum_xas = 0;",
              "   }",
              "   g_prev_f_tv = now_tv;",
              "   g_telem.frame_cd_reads = 0;",
              "   g_telem.frame_cd_us = 0;",
              "   g_telem.frame_xa_sectors = 0;",
              "   g_telem.frame_gpu_us = 0;",
              "   g_telem.frame_poly_total = 0;",
              "   g_telem.frame_poly_light = 0;",
              "   g_telem.frame_poly_blend = 0;",
              "   g_telem.frame_poly_tex = 0;",
              "   g_telem.frame_sprites = 0;",
              "   g_telem.frame_vram_writes = 0;",
              "   g_telem.frame_spu_us = 0;",
              "   g_telem.frame_feed_us = 0;",
              "}",
              orig_retro_run,
              "   telem_step_frame();"
          ])

          libretro_c = (
              libretro_c.replace(target_load_game, new_load_game, 1)
                        .replace(target_lighting_block, new_lighting_block, 1)
                        .replace(orig_retro_run, new_retro_run, 1)
          )

          with open("frontend/libretro.c", "w") as f:
              f.write(libretro_c)
          print("SUCCESS 5: Patched frontend/libretro.c with /tmp/pcsx_telemetry.log writer!")
          EOF

          python3 patch_v39.py | tee ../build_v39_report.txt
          rm -f patch_v39.py

          # Optimize Makefiles (Exact V27/V37 flags)
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile

          echo "=== VERIFIED GIT DIFF FOR V39 ===" >> ../build_v39_report.txt
          git diff Makefile frontend/libretro.c libpcsxcore/cdrom.c libpcsxcore/cdriso.c plugins/dfsound/spu.c plugins/gpu_unai/gpulib_if.cpp >> ../build_v39_report.txt

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            A9_V27_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -funroll-loops -fpeel-loops -ftracer -fno-tree-vectorize -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fgcse-sm -fgcse-las -fipa-pta -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$A9_V27_FLAGS"
            export CXXFLAGS="$A9_V27_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $A9_V27_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $A9_V27_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_v39.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
            ls -lh ../pcsx_rearmed_libretro.so >> ../build_v39_report.txt
          '
          cat build_v39_report.txt

      - name: Upload v39 .so File & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-v39-telemetry
          path: |
            pcsx_rearmed_libretro.so
            build_v39_report.txt
            build_v39.log
