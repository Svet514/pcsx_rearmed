name: Build PCSX-ReARMed e73e384c Max-50FPS Cortex-A9

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Commit e73e384c (Aug 2021) & Apply Clean Patches
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout e73e384cfacbb9b03d14f809e1283dc715068e3c
          git submodule update --init

          # 1. Fix Blue's Clues Cat/Dog cutscene: only lock cdr.Channel on real audio sectors (!= 255) and ignore MODE_SF channel mismatches on 255
          sed -i 's/if( cdr.FirstSector == 1 )/if( (cdr.Transfer[4 + 2] \& 0x4) \&\& cdr.Transfer[4 + 1] != 255 \&\& (cdr.FirstSector == 1 || cdr.Channel == 255 || (cdr.Mode \& MODE_SF) == 0) )/g' libpcsxcore/cdrom.c

          # 2. Also ensure decode_xa.c immediately drops any rogue channel 255 sector
          sed -i 's/xdp->nbits = 4;/if (sectorp[1] == 0xff) return -1; xdp->nbits = 4;/g' libpcsxcore/decode_xa.c

          # 3. Force -O3 everywhere in Makefiles
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile

          # 4. Statically link libstdc++ and libgcc for Retroleap Alpha 10
          sed -i 's/-shared/-shared -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -static-libstdc++ -static-libgcc/g' Makefile

          echo "=== GIT DIFF APPLIED TO e73e384c ===" > ../build_e73e384c_report.txt
          git diff >> ../build_e73e384c_report.txt

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            # Pure 50FPS Cortex-A9 800MHz flags: added -finline-functions -finline-limit=1000 -fira-loop-pressure -fsched-pressure
            ULTIMATE_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -munaligned-access -O3 -finline-functions -finline-limit=1000 -funroll-loops -fpeel-loops -ftracer -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -funsafe-loop-optimizations -fira-loop-pressure -fsched-pressure -fstrict-aliasing -ftree-vectorize -fprefetch-loop-arrays --param l1-cache-size=32 --param l1-cache-line-size=32 --param l2-cache-size=128 -fno-plt -fno-semantic-interposition -fgcse-sm -fgcse-las -fipa-pta -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$ULTIMATE_FLAGS"
            export CXXFLAGS="$ULTIMATE_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $ULTIMATE_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $ULTIMATE_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_e73e384c.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
          '
          cat build_e73e384c_report.txt

      - name: Upload Ready-to-Use .so File & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-e73e384c-max50fps
          path: |
            pcsx_rearmed_libretro.so
            build_e73e384c_report.txt
            build_e73e384c.log
