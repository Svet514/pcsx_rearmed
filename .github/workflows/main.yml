name: Build PCSX-ReARMed Exact Retroleap Match

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: debian:stretch
    steps:
      - name: Install Old-GLIBC ARM Cross-Compilers (GCC 6 - Max Compatibility)
        run: |
          echo "deb http://archive.debian.org/debian stretch main" > /etc/apt/sources.list
          apt-get update -o Acquire::Check-Valid-Until=false
          apt-get install -y --allow-unauthenticated \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            git make wget unzip file binutils ca-certificates

      - name: Inspect Retroleap v2.0.0-alpha10 Exact Config
        run: |
          wget --no-check-certificate -q https://github.com/mac2612/retroleap/archive/refs/tags/v2.0.0-alpha10.zip -O alpha10_src.zip
          unzip -q alpha10_src.zip
          echo "=== RETROLEAP ALPHA 10 LF2000 DEFCONFIG ===" > build_report.txt
          cat retroleap-2.0.0-alpha10/configs/lf2000* >> build_report.txt || true
          echo "=== RETROLEAP ALPHA 10 PCSX_REARMED RECIPE ===" >> build_report.txt
          find retroleap-2.0.0-alpha10/package -iname "*pcsx*" -exec cat {} + >> build_report.txt || true

      - name: Checkout libretro/pcsx_rearmed at d2b40c8
        run: |
          git config --global http.sslVerify false
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout d2b40c8
          git submodule update --init
          # Force -O3 optimization instead of -O2
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile
          # Statically link libstdc++ and libgcc so it never fails on missing C++ libraries
          sed -i 's/-shared/-shared -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -static-libstdc++ -static-libgcc/g' Makefile

      - name: Build 1 - Cortex-A9 + Unai + CHD (hardfp ABI)
        run: |
          cd src
          find . -name "*.o" -delete
          rm -f pcsx_rearmed_libretro.so
          OPT_FLAGS="-mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=hard -O3 -fomit-frame-pointer -ffast-math -fstrict-aliasing -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector"
          
          export CFLAGS="$OPT_FLAGS"
          export CXXFLAGS="$OPT_FLAGS"
          export ASFLAGS="-mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=hard"
          
          make -f Makefile.libretro \
            platform=unix \
            ARCH=arm \
            DYNAREC=ari64 \
            HAVE_NEON=0 \
            HAVE_VFP=1 \
            HAVE_CHD=1 \
            BUILTIN_GPU=unai \
            CC="arm-linux-gnueabihf-gcc $OPT_FLAGS" \
            CXX="arm-linux-gnueabihf-g++ $OPT_FLAGS -static-libstdc++ -static-libgcc" \
            AS="arm-linux-gnueabihf-as -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=hard" \
            AR=arm-linux-gnueabihf-ar \
            -j2 2>&1 | tee ../build_hardfp.log
          arm-linux-gnueabihf-strip --strip-unneeded pcsx_rearmed_libretro.so
          cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro_hardfp.so

      - name: Build 2 - Cortex-A9 + Unai + CHD (softfp ABI)
        run: |
          cd src
          find . -name "*.o" -delete
          rm -f pcsx_rearmed_libretro.so
          OPT_FLAGS="-mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -O3 -fomit-frame-pointer -ffast-math -fstrict-aliasing -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector"
          
          export CFLAGS="$OPT_FLAGS"
          export CXXFLAGS="$OPT_FLAGS"
          export ASFLAGS="-mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"
          
          make -f Makefile.libretro \
            platform=unix \
            ARCH=arm \
            DYNAREC=ari64 \
            HAVE_NEON=0 \
            HAVE_VFP=1 \
            HAVE_CHD=1 \
            BUILTIN_GPU=unai \
            CC="arm-linux-gnueabi-gcc $OPT_FLAGS" \
            CXX="arm-linux-gnueabi-g++ $OPT_FLAGS -static-libstdc++ -static-libgcc" \
            AS="arm-linux-gnueabi-as -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp" \
            AR=arm-linux-gnueabi-ar \
            -j2 2>&1 | tee ../build_softfp.log
          arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
          cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro_softfp.so

      - name: Check Dependencies & GLIBC Symbols
        run: |
          echo "=== NEEDED SHARED LIBRARIES (MUST NOT REQUIRE libstdc++.so.6) ===" >> build_report.txt
          arm-linux-gnueabihf-readelf -d pcsx_rearmed_libretro_hardfp.so | grep NEEDED >> build_report.txt || true
          echo "=== GLIBC SYMBOL VERSIONS REQUIRED ===" >> build_report.txt
          arm-linux-gnueabihf-objdump -T pcsx_rearmed_libretro_hardfp.so | grep GLIBC_ | awk '{print $5}' | sort -u >> build_report.txt || true
          cat build_report.txt

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-leapster-compatible
          path: |
            pcsx_rearmed_libretro_hardfp.so
            pcsx_rearmed_libretro_softfp.so
            build_report.txt
            build_hardfp.log
            build_softfp.log
