name: Build PCSX-ReARMed v23 50FPS-39FPSCushion + GPUUnroll + Cat0528Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Official b1226a3a & Apply v23 Patches
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout b1226a3ab49a2e82e55a7123eb68fded56091044

          # 1. Add scph5502.bin to BIOS list
          sed -i 's/"scph5501.bin"/"scph5502.bin", "scph5501.bin"/g' frontend/libretro.c

          cat << 'EOF' > patch_v23.py
          import sys

          # --- 1. PATCH plugins/dfsound/spu.c: 50 FPS + STRONGER 39-43 FPS CUSHION ---
          with open("plugins/dfsound/spu.c", "r") as f:
              spu_c = f.read()

          spu_c = "#include <sys/time.h>\nstatic int g_spu_div = 826;\n" + spu_c

          old_ns_calc = (
              " if (cycle_diff < 2 * 768)\n"
              "  return;\n"
              "\n"
              " ns_to = (cycle_diff / 768 + 1) & ~1;"
          )
          new_ns_calc = (
              " if (cycle_diff < 2 * g_spu_div)\n"
              "  return;\n"
              "\n"
              " ns_to = (cycle_diff / g_spu_div + 1) & ~1;"
          )

          old_played_adv = "  spu.cycles_played += ns_to * 768;"
          new_played_adv = "  spu.cycles_played += ns_to * g_spu_div;"

          old_async_feed = (
              " if (flags & 1) {\n"
              "  out_current->feed(spu.pSpuBuffer, (unsigned char *)spu.pS - spu.pSpuBuffer);\n"
              "  spu.pS = (short *)spu.pSpuBuffer;"
          )
          new_async_feed = "\n".join([
              " if (flags & 1) {",
              "  static struct timeval after_feed_tv = {0, 0};",
              "  struct timeval before_feed_tv;",
              "  gettimeofday(&before_feed_tv, NULL);",
              "  if (after_feed_tv.tv_sec != 0) {",
              "   long emu_us = (before_feed_tv.tv_sec - after_feed_tv.tv_sec) * 1000000L + (before_feed_tv.tv_usec - after_feed_tv.tv_usec);",
              "   if (emu_us > 20800 && emu_us < 65000) {",
              "    g_spu_div = 700;",
              "    int gen_s = ((unsigned char *)spu.pS - spu.pSpuBuffer) >> 2;",
              "    int need_s = (int)((emu_us * 455L) / 10000L);",
              "    if (need_s - gen_s > 8 && need_s - gen_s < 420) {",
              "     spu.cycles_played -= (unsigned int)((need_s - gen_s) * 700);",
              "     do_samples(cycle, 1);",
              "    }",
              "   } else if (emu_us > 19400) {",
              "    g_spu_div = 780;",
              "   } else {",
              "    g_spu_div = 826;",
              "   }",
              "  }",
              "  out_current->feed(spu.pSpuBuffer, (unsigned char *)spu.pS - spu.pSpuBuffer);",
              "  spu.pS = (short *)spu.pSpuBuffer;",
              "  gettimeofday(&after_feed_tv, NULL);"
          ])

          if old_ns_calc not in spu_c or old_played_adv not in spu_c or old_async_feed not in spu_c:
              print("ERROR: target blocks not found in spu.c!")
              sys.exit(1)

          spu_c = (
              spu_c.replace(old_ns_calc, new_ns_calc, 1)
                   .replace(old_played_adv, new_played_adv, 1)
                   .replace(old_async_feed, new_async_feed, 1)
          )
          with open("plugins/dfsound/spu.c", "w") as f:
              f.write(spu_c)

          with open("libpcsxcore/decode_xa.c", "r") as f:
              dec_xa = f.read()
          dec_xa = dec_xa.replace("44100", "41500")
          with open("libpcsxcore/decode_xa.c", "w") as f:
              f.write(dec_xa)
          print("SUCCESS 1: Patched spu.c & decode_xa.c for 50 FPS + 39-43 FPS zero-lag cushion!")

          # --- 2. PATCH libpcsxcore/cdrom.c: LOG 05:28:71+ & ALLOW REALTIME XA EVEN IN MODE 0xA0 ---
          with open("libpcsxcore/cdrom.c", "r") as f:
              cdrom = f.read()

          # Log CdlSetfilter and CdlSetmode so we see every mode/filter change!
          old_setfilter = "case CdlSetfilter:"
          new_setfilter = "\n".join([
              "case CdlSetfilter:",
              "\t\t\t{ static int sf_c = 0; if (sf_c < 100) { FILE *fp = fopen(\"/tmp/cat_trace.log\", \"a\"); if (fp) { fprintf(fp, \"CD_SETFILTER: File=%d Chan=%d Mode=%02x%c\", cdr.Param[0], cdr.Param[1], cdr.Mode, 10); fclose(fp); } sf_c++; } }"
          ])

          old_setmode = "case CdlSetmode:"
          new_setmode = "\n".join([
              "case CdlSetmode:",
              "\t\t\t{ static int sm_c = 0; if (sm_c < 100) { FILE *fp = fopen(\"/tmp/cat_trace.log\", \"a\"); if (fp) { fprintf(fp, \"CD_SETMODE: NewMode=%02x Loc=%02x:%02x:%02x Flt=%d:%d%c\", cdr.Param[0], cdr.SetSector[0], cdr.SetSector[1], cdr.SetSector[2], cdr.File, cdr.Channel, 10); fclose(fp); } sm_c++; } }"
          ])

          # In cdrReadInterrupt():
          # 1) Log the first sector of each new read when Minute >= 0x05 OR whenever Sub has bit 0x04 (audio) set!
          # 2) Allow CD-XA decoding if (cdr.Mode & MODE_STRSND) OR ((cdr.Transfer[4+2] & 0x44) == 0x44)!
          old_cdxa_block = (
              "\tif ((!cdr.Muted) && (cdr.Mode & MODE_STRSND) && (!Config.Xa) && (cdr.FirstSector != -1)) { // CD-XA\n"
              "\t\t// Firemen 2: Multi-XA files - briefings, cutscenes\n"
              "\t\tif( cdr.FirstSector == 1 && (cdr.Mode & MODE_SF)==0 ) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t}\n"
              "\n"
              "\t\t/* Gameblabla \n"
              "\t\t * Skips playing on channel 255.\n"
              "\t\t * Fixes missing audio in Blue's Clues : Blue's Big Musical. (Should also fix Taxi 2)\n"
              "\t\t * TODO : Check if this is the proper behaviour.\n"
              "\t\t * */\n"
              "\t\tif((cdr.Transfer[4 + 2] & 0x4) &&\n"
              "\t\t\t (cdr.Transfer[4 + 1] == cdr.Channel) &&\n"
              "\t\t\t (cdr.Transfer[4 + 0] == cdr.File) && cdr.Channel != 255) {\n"
              "\t\t\tint ret = xa_decode_sector(&cdr.Xa, cdr.Transfer+4, cdr.FirstSector);\n"
              "\t\t\tif (!ret) {\n"
              "\t\t\t\tcdrAttenuate(cdr.Xa.pcm, cdr.Xa.nsamples, cdr.Xa.stereo);\n"
              "\t\t\t\tSPU_playADPCMchannel(&cdr.Xa);\n"
              "\t\t\t\tcdr.FirstSector = 0;\n"
              "\t\t\t}\n"
              "\t\t\telse cdr.FirstSector = -1;\n"
              "\t\t}\n"
              "\t}"
          )

          new_cdxa_block = "\n".join([
              "\t{",
              "\t\tstatic unsigned char last_m = 0xff, last_s = 0xff, last_sub = 0xff;",
              "\t\tif (cdr.Transfer[0] >= 0x05 || (cdr.Transfer[4 + 2] & 0x04)) {",
              "\t\t\tif (cdr.Transfer[0] != last_m || cdr.Transfer[1] != last_s || cdr.Transfer[4 + 2] != last_sub) {",
              "\t\t\t\tstatic int sec_log = 0;",
              "\t\t\t\tif (sec_log < 150) {",
              "\t\t\t\t\tFILE *fp = fopen(\"/tmp/cat_trace.log\", \"a\");",
              "\t\t\t\t\tif (fp) { fprintf(fp, \"CD_SEC: %02x:%02x:%02x Mode=%02x First=%d Muted=%d Xa=%d Flt=%d:%d Sec=%d:%d Sub=%02x Cod=%02x%c\", cdr.Transfer[0], cdr.Transfer[1], cdr.Transfer[2], cdr.Mode, cdr.FirstSector, cdr.Muted, Config.Xa, cdr.File, cdr.Channel, cdr.Transfer[4+0], cdr.Transfer[4+1], cdr.Transfer[4+2], cdr.Transfer[4+3], 10); fclose(fp); }",
              "\t\t\t\t\tsec_log++;",
              "\t\t\t\t}",
              "\t\t\t\tlast_m = cdr.Transfer[0]; last_s = cdr.Transfer[1]; last_sub = cdr.Transfer[4 + 2];",
              "\t\t\t}",
              "\t\t}",
              "\t}",
              "\tif ((!cdr.Muted) && ((cdr.Mode & MODE_STRSND) || ((cdr.Transfer[4 + 2] & 0x44) == 0x44)) && (!Config.Xa) && (cdr.FirstSector != -1)) { // CD-XA",
              "\t\tif (cdr.FirstSector == 1 && ((cdr.Mode & MODE_SF) == 0 || !(cdr.Mode & MODE_STRSND)) && (cdr.Transfer[4 + 2] & 0x4) && cdr.Transfer[4 + 1] != 255) {",
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];",
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];",
              "\t\t}",
              "\t\tif ((cdr.Transfer[4 + 2] & 0x4) &&",
              "\t\t    (cdr.Transfer[4 + 1] == cdr.Channel) &&",
              "\t\t    (cdr.Transfer[4 + 0] == cdr.File) && cdr.Channel != 255) {",
              "\t\t\tint ret = xa_decode_sector(&cdr.Xa, cdr.Transfer+4, cdr.FirstSector);",
              "\t\t\tif (!ret) {",
              "\t\t\t\tcdrAttenuate(cdr.Xa.pcm, cdr.Xa.nsamples, cdr.Xa.stereo);",
              "\t\t\t\tSPU_playADPCMchannel(&cdr.Xa);",
              "\t\t\t\tcdr.FirstSector = 0;",
              "\t\t\t} else {",
              "\t\t\t\tif (cdr.FirstSector != 1) cdr.FirstSector = -1;",
              "\t\t\t}",
              "\t\t}",
              "\t}"
          ])

          if old_setfilter not in cdrom or old_setmode not in cdrom or old_cdxa_block not in cdrom:
              print("ERROR: target blocks not found in cdrom.c!")
              sys.exit(1)

          cdrom = (
              cdrom.replace(old_setfilter, new_setfilter, 1)
                   .replace(old_setmode, new_setmode, 1)
                   .replace(old_cdxa_block, new_cdxa_block, 1)
          )
          with open("libpcsxcore/cdrom.c", "w") as f:
              f.write(cdrom)
          print("SUCCESS 2: Patched libpcsxcore/cdrom.c with CD_SETMODE/CD_SETFILTER/CD_SEC loggers + Mode 0xA0 XA fallback!")
          EOF

          python3 patch_v23.py > ../build_v23_report.txt
          rm -f patch_v23.py

          # Optimize Makefiles
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile

          echo "=== VERIFIED GIT DIFF FOR V23 ===" >> ../build_v23_report.txt
          git diff libpcsxcore/cdrom.c libpcsxcore/decode_xa.c plugins/dfsound/spu.c >> ../build_v23_report.txt

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            A9_V23_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -funroll-loops -fpeel-loops -ftracer -fno-tree-vectorize -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fgcse-sm -fgcse-las -fipa-pta -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$A9_V23_FLAGS"
            export CXXFLAGS="$A9_V23_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $A9_V23_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $A9_V23_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_v23.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
            ls -lh ../pcsx_rearmed_libretro.so >> ../build_v23_report.txt
          '
          cat build_v23_report.txt

      - name: Upload v23 .so File & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-v23-50fps-cat0528
          path: |
            pcsx_rearmed_libretro.so
            build_v23_report.txt
            build_v23.log
