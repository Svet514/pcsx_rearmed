name: Build PCSX-ReARMed V68 (2026 Master + 46% Fluent Clock + Native 320w 3D Raster + 320x240 1:1 SDL + 50.00Hz Audio)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: pcsx-rearmed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Current libretro/pcsx_rearmed Master
        run: |
          rm -rf pcsx_src build_v68_report.txt build_v68.log
          git clone --depth 1 https://github.com/libretro/pcsx_rearmed.git pcsx_src
          cd pcsx_src
          echo "=== UPSTREAM MASTER BASE COMMIT ===" > ../build_v68_report.txt
          git log -1 --format="%H (%ci) %s" >> ../build_v68_report.txt

      - name: Apply V68 Master Patches (46% Clock + Native 320w 3D Raster + 320x240 1:1 SDL Vout + 50.00Hz DAC Resampler)
        run: |
          cd pcsx_src
          python3 - << 'EOF'
          import os
          import re

          report_lines = []
          def log_msg(msg):
              print(msg)
              report_lines.append(msg)

          def extract_c_arg_names(params_str):
              ps = params_str.strip()
              if not ps or ps == "void":
                  return ""
              names = []
              for p in ps.split(","):
                  m = re.search(r"([A-Za-z_][A-Za-z0-9_]*)\s*(?:\[[^\]]*\])?\s*$", p.strip())
                  assert m is not None, f"Could not parse C param name from: {p!r}"
                  names.append(m.group(1))
              return ", ".join(names)

          def find_matching_delim(text, open_idx, open_ch="{", close_ch="}"):
              assert text[open_idx] == open_ch, f"Expected {open_ch!r} at {open_idx}"
              depth = 0
              for idx in range(open_idx, len(text)):
                  ch = text[idx]
                  if ch == open_ch:
                      depth += 1
                  elif ch == close_ch:
                      depth -= 1
                      if depth == 0:
                          return idx
              raise AssertionError(f"Unmatched {open_ch!r} in C/C++ source")

          def find_matching_brace(text, open_idx):
              return find_matching_delim(text, open_idx, "{", "}")

          # 1. Scoped Cortex-A9 flags + -DGPU_UNAI_USE_INT_DIV_MULTINV
          with open("Makefile.libretro", "r") as f:
              mklr = f.read()

          extra_mk = [
              "",
              "# V68: Keep -mno-unaligned-access globally for ari64 JIT; enable hardware unaligned loads + 4KB L1 CLZ/SMULL div on GPU/GTE/SPU/Vout",
              "deps/libchdr/%.o: CFLAGS += -munaligned-access -O3 -fno-strict-aliasing",
              "plugins/gpulib/%.o frontend/cspace.o frontend/libretro.o plugins/dfsound/spu.o: CFLAGS += -munaligned-access -Ofast -fno-strict-aliasing",
              "libpcsxcore/gte.o libpcsxcore/gte_nf.o libpcsxcore/gte_divider.o libpcsxcore/mdec.o: CFLAGS += -munaligned-access -Ofast -fno-strict-aliasing",
              "plugins/gpu_unai/gpulib_if.o: CFLAGS += -DGPU_UNAI_USE_INT_DIV_MULTINV -munaligned-access -Ofast -fno-strict-aliasing",
              "plugins/gpu_unai/gpulib_if.o: CXXFLAGS += -DGPU_UNAI_USE_INT_DIV_MULTINV -munaligned-access -Ofast -fno-strict-aliasing",
          ]
          mklr += "\n".join(extra_mk) + "\n"
          with open("Makefile.libretro", "w") as f:
              f.write(mklr)
          log_msg("SUCCESS 1: Enabled scoped -munaligned-access -Ofast + -DGPU_UNAI_USE_INT_DIV_MULTINV!")

          # 2A. Patch libpcsxcore/psxdma.c: Clamp 3D DMA2 gpuIdleAfter <= 512 cycles, ZERO mid-frame psxRegs.cycle jumps!
          dma_p = "libpcsxcore/psxdma.c"
          with open(dma_p, "r") as f:
              dma_txt = f.read()
          old_dma2_chain = (
              "\t\t\tpsxRegs.gpuIdleAfter = psxRegs.cycle + cycles_sum + cycles_last_cmd;\n"
              "\t\t\tset_event(PSXINT_GPUDMA, cycles_sum);"
          )
          new_dma2_chain = (
              "\t\t\tif (!do_walking && !(HW_GPU_STATUS & SWAP32(PSXGPU_RGB24))) {\n"
              "\t\t\t\tif (cycles_sum > 512) cycles_sum = 512;\n"
              "\t\t\t\tcycles_last_cmd = 0;\n"
              "\t\t\t}\n"
              "\t\t\tpsxRegs.gpuIdleAfter = psxRegs.cycle + cycles_sum + cycles_last_cmd;\n"
              "\t\t\tset_event(PSXINT_GPUDMA, cycles_sum);"
          )
          assert old_dma2_chain in dma_txt, "Could not find DMA2 chain gpuIdleAfter block in libpcsxcore/psxdma.c"
          with open(dma_p, "w") as f:
              f.write(dma_txt.replace(old_dma2_chain, new_dma2_chain, 1))
          log_msg("SUCCESS 2A: Dialed back 3D DMA2 gpuIdleAfter spin-stalls in psxdma.c (zero mid-frame cycle jumps)!")

          # 2B. Pair NDHACK_NO_LD_DELAY with DisableStalls in emu_if.c & set fluent CYCLE_MULT_DEFAULT = 217 (46.1% PS1 clock)
          emu_p = "libpcsxcore/new_dynarec/emu_if.c"
          with open(emu_p, "r") as f:
              emu_txt = f.read()
          old_nostalls = "if (Config.DisableStalls)\n\t\tndrc_g.hacks |= NDHACK_NO_STALLS;"
          new_nostalls = "if (Config.DisableStalls)\n\t\tndrc_g.hacks |= (NDHACK_NO_STALLS | NDHACK_NO_LD_DELAY);"
          assert old_nostalls in emu_txt, "Could not find Config.DisableStalls in emu_if.c"
          with open(emu_p, "w") as f:
              f.write(emu_txt.replace(old_nostalls, new_nostalls, 1))

          psxcom_p = "libpcsxcore/psxcommon.h"
          with open(psxcom_p, "r") as f:
              psxcom_txt = f.read()
          psxcom_new, n_cm_def = re.subn(r"(#define\s+CYCLE_MULT_DEFAULT\s+)\d+", r"\g<1>217", psxcom_txt, count=1)
          assert n_cm_def == 1, "Could not update CYCLE_MULT_DEFAULT in psxcommon.h"
          with open(psxcom_p, "w") as f:
              f.write(psxcom_new)
          log_msg("SUCCESS 2B: Enabled NDHACK_NO_LD_DELAY & set fluent CYCLE_MULT_DEFAULT=217 (46.1% PS1 clock)!")

          # 2C. Hook chd_read() in deps/libchdr/src/libchdr_chd.c
          chd_src_p = "deps/libchdr/src/libchdr_chd.c"
          with open(chd_src_p, "r") as f:
              chd_txt = f.read()
          m_chd = re.search(r"^([^\n;{}]*\bchd_error\s+)chd_read\s*\(([^;{}]*)\)\s*\{", chd_txt, flags=re.M)
          assert m_chd is not None, "Could not find chd_read in libchdr_chd.c"
          chd_ret, chd_params = m_chd.group(1), m_chd.group(2)
          chd_args = extract_c_arg_names(chd_params)
          chd_hdr = "#include <stdint.h>\nextern uint64_t leap_pcsx_us(void);\nextern void leap_pcsx_add_cd(uint32_t dt_us);\n"
          chd_wrap = (
              f"static chd_error leap_chd_read_inner({chd_params});\n"
              f"{chd_ret}chd_read({chd_params}) {{\n"
              f"\tuint64_t _t0 = leap_pcsx_us();\n"
              f"\tchd_error _r = leap_chd_read_inner({chd_args});\n"
              f"\tleap_pcsx_add_cd((uint32_t)(leap_pcsx_us() - _t0));\n"
              f"\treturn _r;\n"
              f"}}\n"
              f"static chd_error leap_chd_read_inner({chd_params})\n{{"
          )
          with open(chd_src_p, "w") as f:
              f.write(chd_hdr + chd_txt[:m_chd.start()] + chd_wrap + chd_txt[m_chd.end():])
          log_msg("SUCCESS 2C: Hooked chd_read() in libchdr_chd.c!")

          # 3. CD-XA unmute guard in xa.c & SPUasync() telemetry hook in spu.c
          xa_p = "plugins/dfsound/xa.c"
          with open(xa_p, "r") as f:
              xa_txt = f.read()
          old_feed_xa = "if(!spu.bSPUIsOpen) return;"
          new_feed_xa = (
              "if(!spu.bSPUIsOpen) return;\n"
              " if (spu.iLeftXAVol < 0x2000 && spu.iRightXAVol < 0x2000) { spu.iLeftXAVol = 0x7fff; spu.iRightXAVol = 0x7fff; }\n"
              " spu.spuCtrl |= CTRL_CD;"
          )
          assert old_feed_xa in xa_txt
          with open(xa_p, "w") as f:
              f.write(xa_txt.replace(old_feed_xa, new_feed_xa, 1))

          spu_p = "plugins/dfsound/spu.c"
          with open(spu_p, "r") as f:
              spu_txt = f.read()
          m_spu = re.search(r"^([^\n;{}]*\bvoid\b[^\n;{}]*)\bSPUasync\s*\(([^;{}]*)\)\s*\{", spu_txt, flags=re.M)
          assert m_spu is not None
          spu_ret, spu_params = m_spu.group(1), m_spu.group(2)
          spu_args = extract_c_arg_names(spu_params)
          spu_hdr = (
              "#include <stdint.h>\n"
              "extern uint64_t leap_pcsx_us(void);\n"
              "extern void leap_pcsx_spu_enter(void);\n"
              "extern void leap_pcsx_spu_leave(uint32_t dt_us);\n"
          )
          spu_wrap = (
              f"static void leap_SPUasync_inner({spu_params});\n"
              f"{spu_ret}SPUasync({spu_params}) {{\n"
              f" uint64_t _t0 = leap_pcsx_us();\n"
              f" leap_pcsx_spu_enter();\n"
              f" leap_SPUasync_inner({spu_args});\n"
              f" leap_pcsx_spu_leave((uint32_t)(leap_pcsx_us() - _t0));\n"
              f"}}\n"
              f"static void leap_SPUasync_inner({spu_params})\n{{"
          )
          with open(spu_p, "w") as f:
              f.write(spu_hdr + spu_txt[:m_spu.start()] + spu_wrap + spu_txt[m_spu.end():])
          log_msg("SUCCESS 3: Patched xa.c & spu.c!")

          # 4A. Shrink s_invTable 256KB -> 4KB (L1-cache hot) & fix s_invTable[uDen - 1] in gpu_fixedpoint.h
          fp_p = "plugins/gpu_unai/gpu_fixedpoint.h"
          with open(fp_p, "r") as f:
              fp_txt = f.read()
          assert "#define TABLE_BITS 16" in fp_txt and "s_invTable[uDen]" in fp_txt
          fp_txt = fp_txt.replace("#define TABLE_BITS 16", "#define TABLE_BITS 10", 1)
          fp_txt = fp_txt.replace("s_invTable[uDen]", "s_invTable[uDen - 1]", 1)
          with open(fp_p, "w") as f:
              f.write(fp_txt)
          log_msg("SUCCESS 4A: Shrunk s_invTable to 4KB & fixed s_invTable[uDen - 1]!")

          # 4B. Track 2D mem2vram uploads per buffer in plugins/gpulib/gpu.h (do_vram_line) so 2D splash/loading screens keep 512->320 while 3D scenes rasterize at native 320w!
          gph_p = "plugins/gpulib/gpu.h"
          with open(gph_p, "r") as f:
              gph = f.read()
          old_dvl = "static inline void do_vram_line(uint16_t *vram_, int x, int y,\n    uint16_t *mem, int l, int is_read, uint32_t r6)\n{"
          new_dvl = (
              "extern uint8_t g_v68_buf_2d[4];\n"
              "extern uint8_t g_v68_buf_320[4];\n"
              "static inline void do_vram_line(uint16_t *vram_, int x, int y,\n"
              "    uint16_t *mem, int l, int is_read, uint32_t r6)\n{\n"
              "  if (!is_read && l >= 200 && x < 640) {\n"
              "    unsigned _bi = (((unsigned)y >= 256u) ? 2u : 0u) | (((unsigned)x >= 384u) ? 1u : 0u);\n"
              "    g_v68_buf_2d[_bi] = 1u;\n"
              "    g_v68_buf_320[_bi] = 0u;\n"
              "  }"
          )
          assert old_dvl in gph, "Could not find do_vram_line in plugins/gpulib/gpu.h"
          with open(gph_p, "w") as f:
              f.write(gph.replace(old_dvl, new_dvl, 1))
          log_msg("SUCCESS 4B: Added per-buffer 2D mem2vram guard in plugins/gpulib/gpu.h!")

          # 4C. Goal 1 — Native 320-Wide 3D Rasterization in gpu_raster_image.h, gpu_raster_polygon.h, gpu_raster_sprite.h, gpu_raster_line.h, and gpulib_if.cpp!
          # 4C-1: gpu_raster_image.h (gpuClearImage & gpuMoveImage)
          ri_p = "plugins/gpu_unai/gpu_raster_image.h"
          with open(ri_p, "r") as f:
              ri = f.read()
          m_clr = re.search(r"void\s+gpuClearImage\s*\([^;{}]*\)\s*\{", ri)
          assert m_clr is not None, "Could not find gpuClearImage in gpu_raster_image.h"
          clr_b = ri.index("{", m_clr.start())
          clr_e = find_matching_brace(ri, clr_b)
          clr_body = ri[clr_b + 1 : clr_e]
          # Find width/height variables in gpuClearImage (x0, y0, w0, h0)
          assert "w0 = " in clr_body and "x0 = " in clr_body and "y0 = " in clr_body, "Unexpected vars in gpuClearImage"
          clr_hook = """
          \tif (pl_rearmed_cbs.scale_hires && gpu.screen.hres >= 508 && gpu.screen.hres <= 516 && !(gpu.status & PSX_GPU_STATUS_RGB24) && w0 > 0 && h0 > 0) {
          \t\tunsigned _bi = (((unsigned)y0 >= 256u) ? 2u : 0u) | (((unsigned)x0 >= 384u) ? 1u : 0u);
          \t\tif (w0 >= 480 && h0 >= 160) {
          \t\t\tg_v68_buf_2d[_bi] = 0u;
          \t\t\tg_v68_buf_320[_bi] = 1u;
          \t\t\tg_v68_scale320_active = 1;
          \t\t\tg_v68_scale320_x0 = (x0 >= 384) ? 512 : 0;
          \t\t}
          \t\tif (g_v68_scale320_active || g_v68_buf_320[_bi]) {
          \t\t\ts32 _bx = (x0 >= 384) ? 512 : 0;
          \t\t\ts32 _x1 = x0 + w0;
          \t\t\tx0 = _bx + (((x0 - _bx) * 5) >> 3);
          \t\t\t_x1 = _bx + (((_x1 - _bx) * 5 + 7) >> 3);
          \t\t\tw0 = _x1 - x0;
          \t\t}
          \t}
          """
          # Insert clr_hook right after w0 and h0 are parsed (before clipping/alignment)
          m_w0h0 = re.search(r"h0\s*=\s*[^\n;]+;", clr_body)
          assert m_w0h0 is not None
          ins_p = clr_b + 1 + m_w0h0.end()
          ri = "extern \"C\" { extern uint8_t g_v68_buf_2d[4]; extern uint8_t g_v68_buf_320[4]; extern int g_v68_scale320_active; extern int g_v68_scale320_x0; }\n" + ri[:ins_p] + clr_hook + ri[ins_p:]
          with open(ri_p, "w") as f:
              f.write(ri)

          # 4C-2: gpu_raster_polygon.h (polyInitVertexBuffer scales vertex X relative to g_v68_scale320_x0: seam-free & automatic 8/5 UV step!)
          rp_p = "plugins/gpu_unai/gpu_raster_polygon.h"
          with open(rp_p, "r") as f:
              rp = f.read()
          old_piv = (
              "\t\tvbuf[i].x = GPU_EXPANDSIGN(coords);\n"
              "\t\tvbuf[i].y = GPU_EXPANDSIGN(coords >> 16);"
          )
          new_piv = (
              "\t\ts32 _vx = GPU_EXPANDSIGN(coords);\n"
              "\t\tif (g_v68_scale320_active) {\n"
              "\t\t\ts32 _sx = GPU_EXPANDSIGN(_vx + gpu_unai.DrawingOffset[0]);\n"
              "\t\t\t_vx = g_v68_scale320_x0 + (((_sx - g_v68_scale320_x0) * 5 + 4) >> 3) - gpu_unai.DrawingOffset[0];\n"
              "\t\t}\n"
              "\t\tvbuf[i].x = _vx;\n"
              "\t\tvbuf[i].y = GPU_EXPANDSIGN(coords >> 16);"
          )
          assert old_piv in rp, "Could not find polyInitVertexBuffer X/Y unpack in gpu_raster_polygon.h"
          with open(rp_p, "w") as f:
              f.write(rp.replace(old_piv, new_piv, 1))

          # 4C-3: gpu_raster_sprite.h (scale flat tiles gpuDrawT; textured sprites 0x64..0x7F convert to 320-scaled quads in gpulib_if.cpp!)
          rs_p = "plugins/gpu_unai/gpu_raster_sprite.h"
          with open(rs_p, "r") as f:
              rs = f.read()
          m_dt = re.search(r"void\s+gpuDrawT\s*\([^;{}]*\)\s*\{", rs)
          assert m_dt is not None, "Could not find gpuDrawT in gpu_raster_sprite.h"
          dt_b = rs.index("{", m_dt.start())
          dt_e = find_matching_brace(rs, dt_b)
          dt_body = rs[dt_b + 1 : dt_e]
          m_x1y1 = re.search(r"x1\s*=\s*x0\s*\+[^\n;]+;", dt_body)
          assert m_x1y1 is not None, "Could not find x1 = x0 + w in gpuDrawT"
          dt_hook = """
          \tif (g_v68_scale320_active) {
          \t\tx0 = g_v68_scale320_x0 + (((x0 - g_v68_scale320_x0) * 5) >> 3);
          \t\tx1 = g_v68_scale320_x0 + (((x1 - g_v68_scale320_x0) * 5 + 4) >> 3);
          \t}
          """
          ins_dt = dt_b + 1 + m_x1y1.end()
          rs = rs[:ins_dt] + dt_hook + rs[ins_dt:]
          with open(rs_p, "w") as f:
              f.write(rs)

          # 4C-4: gpu_raster_line.h (scale x0, x1 in gpuDrawLineF / gpuDrawLineG)
          rl_p = "plugins/gpu_unai/gpu_raster_line.h"
          with open(rl_p, "r") as f:
              rl = f.read()
          rl = re.sub(
              r"(x0\s*=\s*GPU_EXPANDSIGN\([^;]+\)\s*\+\s*gpu_unai\.DrawingOffset\[0\];\s*y0\s*=\s*[^\n;]+;\s*x1\s*=\s*GPU_EXPANDSIGN\([^;]+\)\s*\+\s*gpu_unai\.DrawingOffset\[0\];)",
              r"\1 if (g_v68_scale320_active) { x0 = g_v68_scale320_x0 + (((x0 - g_v68_scale320_x0) * 5 + 4) >> 3); x1 = g_v68_scale320_x0 + (((x1 - g_v68_scale320_x0) * 5 + 4) >> 3); }",
              rl
          )
          with open(rl_p, "w") as f:
              f.write(rl)

          # 4C-5: gpulib_if.cpp:
          #   - Update DrawingArea[2] in GP0(E3h/E4h) & renderer_sync_ecmds when 320-wide rasterization is active
          #   - Gate prim_try_simplify_quad_t / gt off ONLY when g_v68_scale320_active != 0 (so 320-scaled quads step UVs by 8/5 via gpuDrawPolyFT + gpu_arm.S, while 256w/320w modes still simplify!)
          #   - Convert textured sprites (0x64..0x67, 0x74..0x77, 0x7C..0x7F) into 0x2C..0x2F textured quads when g_v68_scale320_active != 0 so HUD sprites also scale X by 5/8 with exact UV stepping!
          #   - Full 0x30..0x3F -> 0x20..0x2F high-poly Gouraud->ARM ASM fast path + gput_sum zeroed!
          gpu_p = "plugins/gpu_unai/gpulib_if.cpp"
          with open(gpu_p, "r") as f:
              gpu = f.read()

          gpu = gpu.replace("double v = 1.0 / double(i);", "double v = (i == 1) ? 0.0 : (1.0 / double(i));", 1)
          gpu = gpu.replace(
              '#include "../gpulib/gpu_timing.h"',
              '#include "../gpulib/gpu_timing.h"\n#undef gput_sum\n#define gput_sum(sum, last, cycles) do { (void)(sum); (void)(last); (void)(cycles); } while (0)',
              1
          )

          # Update GP0(E3h) and GP0(E4h) to track unscaled DrawingArea and clamp DrawingArea[2] in 320w mode
          old_e3e4 = "    case 3: {\n      // GP0(E3h) - Set Drawing Area top left (X1,Y1)\n      gpu_unai.DrawingArea[0] = cmd_word         & 0x3FF;\n      gpu_unai.DrawingArea[1] = (cmd_word >> 10) & 0x3FF;\n    } break;\n\n    case 4: {\n      // GP0(E4h) - Set Drawing Area bottom right (X2,Y2)\n      gpu_unai.DrawingArea[2] = (cmd_word         & 0x3FF) + 1;\n      gpu_unai.DrawingArea[3] = ((cmd_word >> 10) & 0x3FF) + 1;\n    } break;"
          new_e3e4 = """    case 3: {
                gpu_unai.DrawingArea[0] = cmd_word         & 0x3FF;
                gpu_unai.DrawingArea[1] = (cmd_word >> 10) & 0x3FF;
                g_v68_raw_da_x0 = gpu_unai.DrawingArea[0];
                g_v68_update_scale320();
              } break;

              case 4: {
                g_v68_raw_da_x2 = (cmd_word         & 0x3FF) + 1;
                gpu_unai.DrawingArea[2] = g_v68_raw_da_x2;
                gpu_unai.DrawingArea[3] = ((cmd_word >> 10) & 0x3FF) + 1;
                g_v68_update_scale320();
              } break;"""
          assert old_e3e4 in gpu, "Could not find GP0 E3/E4 in gpulib_if.cpp"
          gpu = gpu.replace(old_e3e4, new_e3e4, 1)

          # Gate prim_try_simplify_quad_t & gt when g_v68_scale320_active != 0
          for fn_name in ["prim_try_simplify_quad_t", "prim_try_simplify_quad_gt"]:
              pos = 0
              while True:
                  m_sq = re.search(rf"\(\s*simplified_count\s*=\s*{fn_name}\s*\(", gpu[pos:])
                  if not m_sq:
                      break
                  open_p = pos + m_sq.start()
                  close_p = find_matching_delim(gpu, open_p, "(", ")")
                  wrapped = f"(!g_v68_scale320_active && {gpu[open_p:close_p + 1]})"
                  gpu = gpu[:open_p] + wrapped + gpu[close_p + 1 :]
                  pos = open_p + len(wrapped)

          # In textured_sprite(), if g_v68_scale320_active != 0, draw via gpuDrawPolyFT so X scales 5/8 and UVs step 8/5!
          old_ts_call = "gpuDrawS(packet, driver, &w, &h);"
          new_ts_call = """if (g_v68_scale320_active) {
              s32 _sw = 0, _sh = 0;
              switch ((PRIM >> 3) & 3u) {
                case 0: _sw = le16_to_s16(gpu_unai.PacketBuffer.U2[6]) & 0x3FF; _sh = le16_to_s16(gpu_unai.PacketBuffer.U2[7]) & 0x1FF; break;
                case 1: _sw = 1; _sh = 1; break;
                case 2: _sw = 8; _sh = 8; break;
                case 3: _sw = 16; _sh = 16; break;
              }
              if (_sw > 0 && _sh > 0) {
                u32 _c0 = le32_to_u32(gpu_unai.PacketBuffer.U4[0]);
                u32 _xy = le32_to_u32(gpu_unai.PacketBuffer.U4[1]);
                u32 _uvc = le32_to_u32(gpu_unai.PacketBuffer.U4[2]);
                s32 _x0 = GPU_EXPANDSIGN(_xy), _y0 = GPU_EXPANDSIGN(_xy >> 16);
