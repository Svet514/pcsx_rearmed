          log_msg("SUCCESS 5A: Optimized 512->320 & 640->320 fallback blitters in cspace.c!")

          # 5B. Set optimal defaults for Core Options in frontend/libretro_core_options.h
          opt_h_p = "frontend/libretro_core_options.h"
