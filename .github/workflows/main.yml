          # 5A. Optimize 512->320 & 640->320 RGB565 fallback downscalers in frontend/cspace.c
          cs_p = "frontend/cspace.c"
          with open(cs_p, "r") as f:
              cs_txt = f.read()

          m_640 = re.search(r"^void\s+bgr555_to_rgb565_640_to_320\s*\([^;{}]*\)\s*\{", cs_txt, flags=re.M)
          b640_c = find_matching_brace(cs_txt, cs_txt.index("{", m_640.start()))
          fast_640 = (
              "void bgr555_to_rgb565_640_to_320(void * __restrict__ dst_,\n"
              "\tconst void * __restrict__ src_, int dpixels)\n"
              "{\n"
              "\tconst uint32_t * __restrict__ s32 = (const uint32_t *)((uintptr_t)src_ & ~(uintptr_t)3U);\n"
              "\tuint32_t * __restrict__ dst = (uint32_t *)dst_;\n"
              "\tfor (; dpixels >= 8; dpixels -= 8, s32 += 8, dst += 4) {\n"
              "\t\t__builtin_prefetch(s32 + 16);\n"
              "\t\tuint32_t a0 = LE32TOH(s32[0]), a1 = LE32TOH(s32[1]);\n"
              "\t\tuint32_t a2 = LE32TOH(s32[2]), a3 = LE32TOH(s32[3]);\n"
              "\t\tuint32_t a4 = LE32TOH(s32[4]), a5 = LE32TOH(s32[5]);\n"
              "\t\tuint32_t a6 = LE32TOH(s32[6]), a7 = LE32TOH(s32[7]);\n"
              "\t\tdst[0] = bgr555_to_rgb565_pair((a0 & 0xFFFFu) | (a1 << 16));\n"
              "\t\tdst[1] = bgr555_to_rgb565_pair((a2 & 0xFFFFu) | (a3 << 16));\n"
              "\t\tdst[2] = bgr555_to_rgb565_pair((a4 & 0xFFFFu) | (a5 << 16));\n"
              "\t\tdst[3] = bgr555_to_rgb565_pair((a6 & 0xFFFFu) | (a7 << 16));\n"
              "\t}\n"
              "\tfor (; dpixels >= 2; dpixels -= 2, s32 += 2, dst++) {\n"
              "\t\tuint32_t a0 = LE32TOH(s32[0]), a1 = LE32TOH(s32[1]);\n"
              "\t\t*dst = bgr555_to_rgb565_pair((a0 & 0xFFFFu) | (a1 << 16));\n"
              "\t}\n"
              "}"
          )
          cs_txt = cs_txt[:m_640.start()] + fast_640 + cs_txt[b640_c + 1 :]

          m_512 = re.search(r"^void\s+bgr555_to_rgb565_512_to_320\s*\([^;{}]*\)\s*\{", cs_txt, flags=re.M)
          b512_c = find_matching_brace(cs_txt, cs_txt.index("{", m_512.start()))
          fast_512 = (
              "void bgr555_to_rgb565_512_to_320(void * __restrict__ dst_,\n"
              "\tconst void * __restrict__ src_, int dpixels)\n"
              "{\n"
              "\tconst uint32_t * __restrict__ s32 = (const uint32_t *)((uintptr_t)src_ & ~(uintptr_t)3U);\n"
              "\tuint32_t * __restrict__ dst = (uint32_t *)dst_;\n"
              "\tfor (; dpixels >= 10; dpixels -= 10, s32 += 8, dst += 5) {\n"
