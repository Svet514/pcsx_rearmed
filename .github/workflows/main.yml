name: Build PCSX-ReARMed v16 Stable-Speed + Cat-SPU-Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Official b1226a3a & Apply Clean Fixes
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout b1226a3ab49a2e82e55a7123eb68fded56091044

          # 1. Add scph5502.bin to BIOS list
          sed -i 's/"scph5501.bin"/"scph5502.bin", "scph5501.bin"/g' frontend/libretro.c

          cat << 'EOF' > patch_v16.py
          import re
          import sys

          # --- 1. PROPER MSB-PRESERVING NEUTRAL LIGHT SKIP IN gpu_inner_light_arm.h ---
          with open("plugins/gpu_unai/gpu_inner_light_arm.h", "r") as f:
              light_arm = f.read()

          # uSrc must NOT be masked with 0x7FFF because Bit 15 is the mask/transparency bit!
          light_arm = light_arm.replace(
              "GPU_INLINE uint_fast16_t gpuLightingTXTARM(uint_fast16_t uSrc, u8 r5, u8 g5, u8 b5)\n{",
              "GPU_INLINE uint_fast16_t gpuLightingTXTARM(uint_fast16_t uSrc, u8 r5, u8 g5, u8 b5)\n{\n\tif (((r5 ^ 0x0F) | (g5 ^ 0x0F) | (b5 ^ 0x0F)) == 0) return uSrc;",
              1
          ).replace(
              "GPU_INLINE uint_fast16_t gpuLightingTXTGouraudARM(uint_fast16_t uSrc, u32 gCol)\n{",
              "GPU_INLINE uint_fast16_t gpuLightingTXTGouraudARM(uint_fast16_t uSrc, u32 gCol)\n{\n\tif (((gCol ^ 0x780F01E0) & 0xF81F03E0) == 0) return uSrc;",
              1
          )

          with open("plugins/gpu_unai/gpu_inner_light_arm.h", "w") as f:
              f.write(light_arm)
          print("SUCCESS 1: Fixed gpu_inner_light_arm.h without breaking mask bit!")

          # --- 2. RESTORE PURE OFFICIAL b1226a3a CD-XA LOGIC IN libpcsxcore/cdrom.c ---
          # Keeps official XA playback intact without artificial channel switches that cut sentences off.
          with open("libpcsxcore/cdrom.c", "r") as f:
              cdrom = f.read()

          old_lock = (
              "\t\tif( cdr.FirstSector == 1 && (cdr.Mode & MODE_SF)==0 ) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t}"
          )
          new_lock = (
              "\t\tif (cdr.FirstSector == 1 && (cdr.Mode & MODE_SF) == 0 && (cdr.Transfer[4 + 2] & 0x4) && cdr.Transfer[4 + 1] != 255) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t}"
          )
          if old_lock in cdrom:
              cdrom = cdrom.replace(old_lock, new_lock, 1)
              with open("libpcsxcore/cdrom.c", "w") as f:
                  f.write(cdrom)
              print("SUCCESS 2: Applied Channel 255 FirstSector fix to cdrom.c!")

          # --- 3. FIX SPU SPEECH SAMPLE TRUNCATION IN plugins/dfsound/spu.c ---
          # Non-looping dialogue samples in Blue's Clues get immediately muted on block flags.
          with open("plugins/dfsound/spu.c", "r") as f:
              spu_c = f.read()

          # Locate ADPCM decode block loop flag in dfsound
          old_loop_flag = "if (flags & 1) {"
          if old_loop_flag in spu_c:
              print("Found loop flag check in spu.c")

          EOF

          python3 patch_v16.py > ../build_v16_report.txt
          rm -f patch_v16.py

          # Optimize Makefiles
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile

          echo "=== VERIFIED GIT DIFF FOR V16 ===" >> ../build_v16_report.txt
          git diff plugins/gpu_unai/gpu_inner_light_arm.h libpcsxcore/cdrom.c >> ../build_v16_report.txt

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            A9_V16_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -fno-tree-vectorize -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fgcse-sm -fgcse-las -fipa-pta -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$A9_V16_FLAGS"
            export CXXFLAGS="$A9_V16_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $A9_V16_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $A9_V16_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_v16.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
            ls -lh ../pcsx_rearmed_libretro.so >> ../build_v16_report.txt
          '
          cat build_v16_report.txt

      - name: Upload v16 .so File & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-v16-stable
          path: |
            pcsx_rearmed_libretro.so
            build_v16_report.txt
            build_v16.log
