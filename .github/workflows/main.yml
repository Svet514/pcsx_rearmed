              "\t\tuint32_t w4 = LE32TOH(s32[4]), w5 = LE32TOH(s32[5]);\n"
              "\t\tuint32_t w6 = LE32TOH(s32[6]), w7 = LE32TOH(s32[7]);\n"
              "\t\tdst[0] = bgr555_to_rgb565_pair((w0 & 0xFFFFu) | (w1 << 16));\n"
              "\t\tdst[1] = bgr555_to_rgb565_pair(w2);\n"
              "\t\tdst[2] = bgr555_to_rgb565_pair((w3 >> 16) | (w4 << 16));\n"
              "\t\tdst[3] = bgr555_to_rgb565_pair((w5 & 0xFFFFu) | (w6 << 16));\n"
              "\t\tdst[4] = bgr555_to_rgb565_pair((w6 >> 16) | (w7 & 0xFFFF0000u));\n"
              "\t}\n"
              "}"
          )
          cs_txt = cs_txt[:m_512.start()] + fast_512 + cs_txt[b512_c + 1 :]
          with open(cs_p, "w") as f:
