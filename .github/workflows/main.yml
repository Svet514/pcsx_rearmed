name: Build PCSX-ReARMed v9 Clean-Audio + CHD-Cache + ModeSF Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout d2b40c8 & Apply Verified v9 Patches
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout d2b40c8

          # 1. Backport official August 2021 cdrom.c & cdrom.h (e73e384c)
          git checkout e73e384cfacbb9b03d14f809e1283dc715068e3c -- libpcsxcore/cdrom.c libpcsxcore/cdrom.h

          cat << 'EOF' > patch_v9.py
          import sys

          # --- 1. HARDWARE-ACCURATE CD-XA MODE_SF & CHANNEL 255 FIX IN libpcsxcore/cdrom.c ---
          with open("libpcsxcore/cdrom.c", "r") as f:
              cdrom = f.read()

          old_cdxa = (
              "\tif ((!cdr.Muted) && (cdr.Mode & MODE_STRSND) && (!Config.Xa) && (cdr.FirstSector != -1)) { // CD-XA\n"
              "\t\t// Firemen 2: Multi-XA files - briefings, cutscenes\n"
              "\t\tif( cdr.FirstSector == 1 && (cdr.Mode & MODE_SF)==0 ) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t}\n"
              "\n"
              "\t\tif((cdr.Transfer[4 + 2] & 0x4) &&\n"
              "\t\t\t (cdr.Transfer[4 + 1] == cdr.Channel) &&\n"
              "\t\t\t (cdr.Transfer[4 + 0] == cdr.File) && cdr.Channel != 255) {\n"
              "\t\t\tint ret = xa_decode_sector(&cdr.Xa, cdr.Transfer+4, cdr.FirstSector);\n"
              "\t\t\tif (!ret) {\n"
              "\t\t\t\tcdrAttenuate(cdr.Xa.pcm, cdr.Xa.nsamples, cdr.Xa.stereo);\n"
              "\t\t\t\tSPU_playADPCMchannel(&cdr.Xa);\n"
              "\t\t\t\tcdr.FirstSector = 0;\n"
              "\t\t\t}\n"
              "\t\t\telse cdr.FirstSector = -1;\n"
              "\t\t}\n"
              "\t}"
          )

          # How this works:
          # - Ignores any sector with channel == 255 (0xff) so dummy sectors never lock cdr.Channel or kill FirstSector.
          # - When MODE_SF is ON ((cdr.Mode & MODE_SF) != 0, e.g. Sesame Street Sports): strictly requires File == cdr.File and Channel == cdr.Channel!
          #   (unless the game set cdr.Channel == 255, in which case it locks onto the first valid audio channel).
          # - When MODE_SF is OFF ((cdr.Mode & MODE_SF) == 0, e.g. un-filtered cutscenes): if the stream switches channels mid-cutscene
          #   (like Blue's Clues switching from the house intro at 00:29 to Periwinkle the Cat at 00:31), it updates cdr.Channel and re-inits ADPCM (FirstSector=1)!
          new_cdxa = (
              "\tif ((!cdr.Muted) && (cdr.Mode & MODE_STRSND) && (!Config.Xa) && (cdr.FirstSector != -1)) { // CD-XA\n"
              "\t\tif ((cdr.Transfer[4 + 2] & 0x4) && (cdr.Transfer[4 + 1] != 255)) {\n"
              "\t\t\tif ((cdr.Mode & MODE_SF) == 0) {\n"
              "\t\t\t\tif (cdr.FirstSector == 1 || cdr.Transfer[4 + 1] != cdr.Channel || cdr.Transfer[4 + 0] != cdr.File) {\n"
              "\t\t\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t\t\t\tcdr.FirstSector = 1;\n"
              "\t\t\t\t}\n"
              "\t\t\t} else if (cdr.Channel == 255) {\n"
              "\t\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t\t\tcdr.FirstSector = 1;\n"
              "\t\t\t}\n"
              "\t\t\tif ((cdr.Transfer[4 + 1] == cdr.Channel) &&\n"
              "\t\t\t    (cdr.Transfer[4 + 0] == cdr.File) && cdr.Channel != 255) {\n"
              "\t\t\t\tint ret = xa_decode_sector(&cdr.Xa, cdr.Transfer+4, cdr.FirstSector);\n"
              "\t\t\t\tif (!ret) {\n"
              "\t\t\t\t\tcdrAttenuate(cdr.Xa.pcm, cdr.Xa.nsamples, cdr.Xa.stereo);\n"
              "\t\t\t\t\tSPU_playADPCMchannel(&cdr.Xa);\n"
              "\t\t\t\t\tcdr.FirstSector = 0;\n"
              "\t\t\t\t}\n"
              "\t\t\t}\n"
              "\t\t}\n"
              "\t}"
          )

          if old_cdxa not in cdrom:
              print("ERROR: old_cdxa block not matched in libpcsxcore/cdrom.c!")
              sys.exit(1)

          cdrom = cdrom.replace(old_cdxa, new_cdxa, 1)
          with open("libpcsxcore/cdrom.c", "w") as f:
              f.write(cdrom)
          print("SUCCESS 1: Patched libpcsxcore/cdrom.c with hardware-accurate MODE_SF + Channel 255 logic!")

          # --- 2. ADD 8-HUNK RAM CACHE TO libpcsxcore/cdriso.c TO ELIMINATE CHD LZMA THRASHING ---
          with open("libpcsxcore/cdriso.c", "r") as f:
              cdriso = f.read()

          old_chd_read = (
              "\thunk = sector / chd_img->sectors_per_hunk;\n"
              "\tchd_img->sector_in_hunk = sector % chd_img->sectors_per_hunk;\n"
              "\n"
              "\tif (hunk != chd_img->current_hunk)\n"
              "\t{\n"
              "\t\tchd_read(chd_img->chd, hunk, chd_img->buffer);\n"
              "\t\tchd_img->current_hunk = hunk;\n"
              "\t}\n"
              "\n"
              "\tif (dest != cdbuffer) // copy avoid HACK\n"
              "\t\tmemcpy(dest, chd_img->buffer[chd_img->sector_in_hunk],\n"
              "\t\t\tCD_FRAMESIZE_RAW);\n"
              "\treturn CD_FRAMESIZE_RAW;"
          )

          new_chd_read = (
              "\t#define CHD_CACHE_SLOTS 8\n"
              "\tstatic int cache_hunks[CHD_CACHE_SLOTS] = {-1, -1, -1, -1, -1, -1, -1, -1};\n"
              "\tstatic uint8_t *cache_bufs[CHD_CACHE_SLOTS] = {NULL};\n"
              "\tstatic unsigned int cache_age[CHD_CACHE_SLOTS] = {0};\n"
              "\tstatic unsigned int age_counter = 0;\n"
              "\tstatic chd_file *last_chd = NULL;\n"
              "\tint slot = -1, oldest_slot = 0;\n"
              "\tunsigned int hunk_bytes = chd_img->sectors_per_hunk * CD_FRAMESIZE_RAW;\n"
              "\n"
              "\tif (last_chd != chd_img->chd) {\n"
              "\t\tfor (int i = 0; i < CHD_CACHE_SLOTS; i++) cache_hunks[i] = -1;\n"
              "\t\tlast_chd = chd_img->chd;\n"
              "\t}\n"
              "\n"
              "\thunk = sector / chd_img->sectors_per_hunk;\n"
              "\tchd_img->sector_in_hunk = sector % chd_img->sectors_per_hunk;\n"
              "\n"
              "\tfor (int i = 0; i < CHD_CACHE_SLOTS; i++) {\n"
              "\t\tif (cache_hunks[i] == hunk && cache_bufs[i] != NULL) {\n"
              "\t\t\tslot = i;\n"
              "\t\t\tbreak;\n"
              "\t\t}\n"
              "\t}\n"
              "\tif (slot == -1) {\n"
              "\t\tunsigned int min_age = 0xffffffff;\n"
              "\t\tfor (int i = 0; i < CHD_CACHE_SLOTS; i++) {\n"
              "\t\t\tif (cache_bufs[i] == NULL) { oldest_slot = i; break; }\n"
              "\t\t\tif (cache_age[i] < min_age) { min_age = cache_age[i]; oldest_slot = i; }\n"
              "\t\t}\n"
              "\t\tslot = oldest_slot;\n"
              "\t\tif (cache_bufs[slot] == NULL)\n"
              "\t\t\tcache_bufs[slot] = (uint8_t *)malloc(hunk_bytes);\n"
              "\t\tif (cache_bufs[slot] != NULL) {\n"
              "\t\t\tchd_read(chd_img->chd, hunk, cache_bufs[slot]);\n"
              "\t\t\tcache_hunks[slot] = hunk;\n"
              "\t\t}\n"
              "\t}\n"
              "\tif (cache_bufs[slot] != NULL) {\n"
              "\t\tcache_age[slot] = ++age_counter;\n"
              "\t\tmemcpy(dest, cache_bufs[slot] + (chd_img->sector_in_hunk * CD_FRAMESIZE_RAW), CD_FRAMESIZE_RAW);\n"
              "\t\treturn CD_FRAMESIZE_RAW;\n"
              "\t}\n"
              "\tif (hunk != chd_img->current_hunk) {\n"
              "\t\tchd_read(chd_img->chd, hunk, chd_img->buffer);\n"
              "\t\tchd_img->current_hunk = hunk;\n"
              "\t}\n"
              "\tif (dest != cdbuffer)\n"
              "\t\tmemcpy(dest, chd_img->buffer[chd_img->sector_in_hunk], CD_FRAMESIZE_RAW);\n"
              "\treturn CD_FRAMESIZE_RAW;"
          )

          if old_chd_read not in cdriso:
              print("ERROR: old_chd_read not matched in libpcsxcore/cdriso.c!")
              sys.exit(1)

          cdriso = cdriso.replace(old_chd_read, new_chd_read, 1)
          with open("libpcsxcore/cdriso.c", "w") as f:
              f.write(cdriso)
          print("SUCCESS 2: Patched 8-Hunk LRU RAM Cache into libpcsxcore/cdriso.c!")
          EOF

          python3 patch_v9.py > ../build_v9_report.txt
          rm -f patch_v9.py

          # 3. Use -O3 for C files, -Wl,-Bsymbolic, and static libstdc++
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile

          echo "=== VERIFIED GIT DIFF FOR V9 ===" >> ../build_v9_report.txt
          git diff libpcsxcore/cdrom.c libpcsxcore/cdriso.c >> ../build_v9_report.txt

      - name: Compile Inside Ubuntu 18.04 Container (L1-Cache-Sized 1.5MB Binary)
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            # Lean Cortex-A9 r2p9 flags (1.5MB binary size so hot loops stay inside 32KB L1 Instruction Cache!)
            A9_V9_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -O3 -fno-tree-vectorize -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fgcse-sm -fgcse-las -fipa-pta -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$A9_V9_FLAGS"
            export CXXFLAGS="$A9_V9_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $A9_V9_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $A9_V9_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_v9.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
            ls -lh ../pcsx_rearmed_libretro.so >> ../build_v9_report.txt
          '
          cat build_v9_report.txt

      - name: Upload v9 .so File & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-v9-clean
          path: |
            pcsx_rearmed_libretro.so
            build_v9_report.txt
            build_v9.log
