name: Build PCSX-ReARMed V64 (Unlocked PSX Clock + CLZ/SMULL Div + Gouraud->ARM ASM + Cached 320w Vout + Fixed 41.29kHz)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: pcsx-rearmed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Current libretro/pcsx_rearmed Master
        run: |
          rm -rf pcsx_src build_v64_report.txt build_v64.log
          git clone --depth 1 https://github.com/libretro/pcsx_rearmed.git pcsx_src
          cd pcsx_src
          echo "=== UPSTREAM MASTER BASE COMMIT ===" > ../build_v64_report.txt
          git log -1 --format="%H (%ci) %s" >> ../build_v64_report.txt

      - name: Apply V64 Patches (Unlocked PSX Clock + CLZ/SMULL Div + Gouraud->ASM + Cached Vout + Fixed 41.29kHz Resampler)
        run: |
          cd pcsx_src
          python3 - << 'EOF'
          import os
          import re

          report_lines = []
          def log_msg(msg):
              print(msg)
              report_lines.append(msg)

          def extract_c_arg_names(params_str):
              ps = params_str.strip()
              if not ps or ps == "void":
                  return ""
              names = []
              for p in ps.split(","):
                  m = re.search(r"([A-Za-z_][A-Za-z0-9_]*)\s*(?:\[[^\]]*\])?\s*$", p.strip())
                  assert m is not None, f"Could not parse C param name from: {p!r}"
                  names.append(m.group(1))
              return ", ".join(names)

          def find_matching_brace(text, open_idx):
              assert text[open_idx] == "{", f"Expected '{{' at {open_idx}"
              depth = 0
              for idx in range(open_idx, len(text)):
                  ch = text[idx]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return idx
              raise AssertionError("Unmatched '{' in C/C++ source")

          # 1. Scoped Cortex-A9 flags + -DGPU_UNAI_USE_INT_DIV_MULTINV (4-cycle inline ARM CLZ+SMULL div, zero -funroll-loops bloat)
          with open("Makefile.libretro", "r") as f:
              mklr = f.read()

          extra_mk = [
              "",
              "# V64: Keep -mno-unaligned-access globally for ari64 JIT; enable hardware unaligned loads + CLZ/SMULL reciprocal div on GPU/GTE/SPU/Vout",
              "deps/libchdr/%.o: CFLAGS += -munaligned-access -O3 -fno-strict-aliasing",
              "plugins/gpulib/%.o frontend/cspace.o frontend/libretro.o plugins/dfsound/spu.o: CFLAGS += -munaligned-access -Ofast -fno-strict-aliasing",
              "libpcsxcore/gte.o libpcsxcore/gte_nf.o libpcsxcore/gte_divider.o libpcsxcore/mdec.o: CFLAGS += -munaligned-access -Ofast -fno-strict-aliasing",
              "plugins/gpu_unai/gpulib_if.o: CFLAGS += -DGPU_UNAI_USE_INT_DIV_MULTINV -munaligned-access -Ofast -fno-strict-aliasing",
              "plugins/gpu_unai/gpulib_if.o: CXXFLAGS += -DGPU_UNAI_USE_INT_DIV_MULTINV -munaligned-access -Ofast -fno-strict-aliasing",
          ]
          mklr += "\n".join(extra_mk) + "\n"
          with open("Makefile.libretro", "w") as f:
              f.write(mklr)
          log_msg("SUCCESS 1: Enabled -DGPU_UNAI_USE_INT_DIV_MULTINV + scoped -munaligned-access -Ofast (zero loop-unroll bloat)!")

          # 2A. Verify CD-XA subheader handling in libpcsxcore/cdrom.c
          with open("libpcsxcore/cdrom.c", "r") as f:
              cdrom = f.read()
          old_cdrom_xa = "if( cdr.FirstSector == 1 && (cdr.Mode & MODE_SF)==0 ) {"
          if old_cdrom_xa in cdrom:
              new_cdrom_xa = "if (cdr.FirstSector == 1 && (cdr.Mode & MODE_SF) == 0 && (cdr.Transfer[4 + 2] & 0x4) && cdr.Transfer[4 + 1] != 255) {"
              cdrom = cdrom.replace(old_cdrom_xa, new_cdrom_xa, 1)
              with open("libpcsxcore/cdrom.c", "w") as f:
                  f.write(cdrom)
              log_msg("SUCCESS 2A: Patched legacy FirstSector check in libpcsxcore/cdrom.c!")
          else:
              assert "FileChannelSelected" in cdrom, "Expected upstream FileChannelSelected XA handling in libpcsxcore/cdrom.c"
              log_msg("SUCCESS 2A: Verified upstream FileChannelSelected CD-XA handling in libpcsxcore/cdrom.c!")

          # 2B. Hook chd_read() in deps/libchdr/src/libchdr_chd.c for cd_ms(c) telemetry
          chd_src_p = "deps/libchdr/src/libchdr_chd.c"
          with open(chd_src_p, "r") as f:
              chd_txt = f.read()
          m_chd = re.search(r"^([^\n;{}]*\bchd_error\s+)chd_read\s*\(([^;{}]*)\)\s*\{", chd_txt, flags=re.M)
          assert m_chd is not None, "Could not find chd_read definition in libchdr_chd.c"
          chd_ret, chd_params = m_chd.group(1), m_chd.group(2)
          chd_args = extract_c_arg_names(chd_params)
          chd_hdr = "#include <stdint.h>\nextern uint64_t leap_pcsx_us(void);\nextern void leap_pcsx_add_cd(uint32_t dt_us);\n"
          chd_wrap = (
              f"static chd_error leap_chd_read_inner({chd_params});\n"
              f"{chd_ret}chd_read({chd_params}) {{\n"
              f"\tuint64_t _t0 = leap_pcsx_us();\n"
              f"\tchd_error _r = leap_chd_read_inner({chd_args});\n"
              f"\tleap_pcsx_add_cd((uint32_t)(leap_pcsx_us() - _t0));\n"
              f"\treturn _r;\n"
              f"}}\n"
              f"static chd_error leap_chd_read_inner({chd_params})\n{{"
          )
          with open(chd_src_p, "w") as f:
              f.write(chd_hdr + chd_txt[:m_chd.start()] + chd_wrap + chd_txt[m_chd.end():])
          log_msg("SUCCESS 2B: Hooked chd_read() in libchdr_chd.c for cd_ms telemetry!")

          # 3A. Ensure CD-XA volume/CTRL_CD unmute guard in plugins/dfsound/xa.c
          xa_p = "plugins/dfsound/xa.c"
          with open(xa_p, "r") as f:
              xa_txt = f.read()
          old_feed_xa = "if(!spu.bSPUIsOpen) return;"
          new_feed_xa = (
              "if(!spu.bSPUIsOpen) return;\n"
              " if (spu.iLeftXAVol < 0x2000 && spu.iRightXAVol < 0x2000) { spu.iLeftXAVol = 0x7fff; spu.iRightXAVol = 0x7fff; }\n"
              " spu.spuCtrl |= CTRL_CD;"
          )
          assert old_feed_xa in xa_txt, "Could not find FeedXA open guard in plugins/dfsound/xa.c"
          xa_txt = xa_txt.replace(old_feed_xa, new_feed_xa, 1)
          with open(xa_p, "w") as f:
              f.write(xa_txt)
          log_msg("SUCCESS 3A: Added CD-XA volume/CTRL_CD unmute guard in plugins/dfsound/xa.c!")

          # 3B. Hook SPUasync() in plugins/dfsound/spu.c for pure spu_ms telemetry
          spu_p = "plugins/dfsound/spu.c"
          with open(spu_p, "r") as f:
              spu_txt = f.read()
          m_spu = re.search(r"^([^\n;{}]*\bvoid\b[^\n;{}]*)\bSPUasync\s*\(([^;{}]*)\)\s*\{", spu_txt, flags=re.M)
          assert m_spu is not None, "Could not find SPUasync in plugins/dfsound/spu.c"
          spu_ret, spu_params = m_spu.group(1), m_spu.group(2)
          spu_args = extract_c_arg_names(spu_params)
          spu_hdr = (
              "#include <stdint.h>\n"
              "extern uint64_t leap_pcsx_us(void);\n"
              "extern void leap_pcsx_spu_enter(void);\n"
              "extern void leap_pcsx_spu_leave(uint32_t dt_us);\n"
          )
          spu_wrap = (
              f"static void leap_SPUasync_inner({spu_params});\n"
              f"{spu_ret}SPUasync({spu_params}) {{\n"
              f" uint64_t _t0 = leap_pcsx_us();\n"
              f" leap_pcsx_spu_enter();\n"
              f" leap_SPUasync_inner({spu_args});\n"
              f" leap_pcsx_spu_leave((uint32_t)(leap_pcsx_us() - _t0));\n"
              f"}}\n"
              f"static void leap_SPUasync_inner({spu_params})\n{{"
          )
          with open(spu_p, "w") as f:
              f.write(spu_hdr + spu_txt[:m_spu.start()] + spu_wrap + spu_txt[m_spu.end():])
          log_msg("SUCCESS 3B: Hooked SPUasync() in plugins/dfsound/spu.c for spu_ms telemetry!")

          # 4A. Patch plugins/gpu_unai/gpulib_if.cpp:
          #     - Menu lighting gate (<= 85 polys)
          #     - Route high-poly (> 280 polys) Gouraud commands (0x30..0x3F) into flat/raw-textured commands (0x20..0x2F)
          #       using le32_to_u32 / u32_to_le32 so 8bpp & semi-transparent polys hit 2024 gpu_arm.S & prim_try_simplify_quad_t!
          gpu_p = "plugins/gpu_unai/gpulib_if.cpp"
          with open(gpu_p, "r") as f:
              gpu = f.read()

          gpu_top = """#include <stdint.h>
          extern "C" {
          extern uint32_t g_frame_polys;
          extern uint32_t g_last_frame_polys;
          extern uint32_t g_allow_menu_light;
          uint64_t leap_pcsx_us(void);
          void leap_pcsx_add_gpu(uint32_t dt_us);
          }
          struct LeapPcsxGpuScope {
          \tuint64_t _t0;
          \tLeapPcsxGpuScope() : _t0(leap_pcsx_us()) {}
          \t~LeapPcsxGpuScope() { leap_pcsx_add_gpu((uint32_t)(leap_pcsx_us() - _t0)); }
          };
          """
          m_rcmd = re.search(r"^int\s+(?:renderer_)?do_cmd_list\s*\([^;{}]*\)\s*\{", gpu, flags=re.M)
          assert m_rcmd is not None, "Could not find renderer_do_cmd_list in plugins/gpu_unai/gpulib_if.cpp"
          rcmd_brace = gpu.index("{", m_rcmd.start())
          rcmd_inj = (
              "\n\tLeapPcsxGpuScope _lgs;\n"
              "\tconst uint32_t allow_l = g_allow_menu_light;\n"
              "\tuint32_t p_tot = g_frame_polys;\n"
              "\tgpu_unai.config.lighting = (allow_l && g_last_frame_polys <= 85 && p_tot <= 85) ? 1 : 0;\n"
          )
          gpu = gpu_top + gpu[:rcmd_brace + 1] + rcmd_inj + gpu[rcmd_brace + 1 :]

          m_rcmd2 = re.search(r"^int\s+(?:renderer_)?do_cmd_list\s*\([^;{}]*\)\s*\{", gpu, flags=re.M)
          m_sw = re.search(r"^[ \t]*switch\s*\(\s*cmd\s*\)\s*\{?", gpu[m_rcmd2.end():], flags=re.M)
          assert m_sw is not None, "Could not find switch (cmd) in renderer_do_cmd_list"
          sw_start = m_rcmd2.end() + m_sw.start()
          sw_brace = gpu.index("{", sw_start)
          sw_end = find_matching_brace(gpu, sw_brace)

          sw_pre_inj = """    const u32 _leap_orig_cmd = cmd;
              if (cmd >= 0x20u && cmd < 0x40u) {
                p_tot++;
                g_frame_polys = p_tot;
                if (allow_l && p_tot > 85u) gpu_unai.config.lighting = 0;
                if ((p_tot > 280u || g_last_frame_polys > 280u) && (cmd >= 0x30u)) {
                  if ((cmd & 0x04u) == 0u) {
                    const u32 c0 = le32_to_u32(gpu_unai.PacketBuffer.U4[0]);
                    const u32 c1 = le32_to_u32(gpu_unai.PacketBuffer.U4[2]);
                    const u32 c2 = le32_to_u32(gpu_unai.PacketBuffer.U4[4]);
                    if ((cmd & 0x08u) == 0u) {
                      const u32 r = (((c0 & 0xFFu) + (c1 & 0xFFu) + (c2 & 0xFFu) + 1u) * 85u) >> 8;
                      const u32 g = ((((c0 >> 8) & 0xFFu) + ((c1 >> 8) & 0xFFu) + ((c2 >> 8) & 0xFFu) + 1u) * 85u) >> 8;
                      const u32 b = ((((c0 >> 16) & 0xFFu) + ((c1 >> 16) & 0xFFu) + ((c2 >> 16) & 0xFFu) + 1u) * 85u) >> 8;
                      cmd -= 0x10u;
                      gpu_unai.PacketBuffer.U4[0] = u32_to_le32((cmd << 24) | (b << 16) | (g << 8) | r);
                      gpu_unai.PacketBuffer.U4[2] = gpu_unai.PacketBuffer.U4[3];
                      gpu_unai.PacketBuffer.U4[3] = gpu_unai.PacketBuffer.U4[5];
                    } else {
                      const u32 c3 = le32_to_u32(gpu_unai.PacketBuffer.U4[6]);
                      const u32 a01 = ((c0 & c1) + (((c0 ^ c1) & 0xFEFEFEu) >> 1)) & 0xFFFFFFu;
                      const u32 a23 = ((c2 & c3) + (((c2 ^ c3) & 0xFEFEFEu) >> 1)) & 0xFFFFFFu;
                      const u32 c_avg = ((a01 & a23) + (((a01 ^ a23) & 0xFEFEFEu) >> 1)) & 0xFFFFFFu;
                      cmd -= 0x10u;
                      gpu_unai.PacketBuffer.U4[0] = u32_to_le32((cmd << 24) | c_avg);
                      gpu_unai.PacketBuffer.U4[2] = gpu_unai.PacketBuffer.U4[3];
                      gpu_unai.PacketBuffer.U4[3] = gpu_unai.PacketBuffer.U4[5];
                      gpu_unai.PacketBuffer.U4[4] = gpu_unai.PacketBuffer.U4[7];
                    }
                  } else if (gpu_unai.config.lighting == 0) {
                    if ((cmd & 0x08u) == 0u) {
                      cmd = (cmd - 0x10u) | 0x01u;
                      gpu_unai.PacketBuffer.U4[0] = u32_to_le32((cmd << 24) | 0x808080u);
                      gpu_unai.PacketBuffer.U4[3] = gpu_unai.PacketBuffer.U4[4];
                      gpu_unai.PacketBuffer.U4[4] = gpu_unai.PacketBuffer.U4[5];
                      gpu_unai.PacketBuffer.U4[5] = gpu_unai.PacketBuffer.U4[7];
                      gpu_unai.PacketBuffer.U4[6] = gpu_unai.PacketBuffer.U4[8];
                    } else {
                      cmd = (cmd - 0x10u) | 0x01u;
                      gpu_unai.PacketBuffer.U4[0] = u32_to_le32((cmd << 24) | 0x808080u);
                      gpu_unai.PacketBuffer.U4[3] = gpu_unai.PacketBuffer.U4[4];
                      gpu_unai.PacketBuffer.U4[4] = gpu_unai.PacketBuffer.U4[5];
                      gpu_unai.PacketBuffer.U4[5] = gpu_unai.PacketBuffer.U4[7];
                      gpu_unai.PacketBuffer.U4[6] = gpu_unai.PacketBuffer.U4[8];
                      gpu_unai.PacketBuffer.U4[7] = gpu_unai.PacketBuffer.U4[10];
                      gpu_unai.PacketBuffer.U4[8] = gpu_unai.PacketBuffer.U4[11];
                    }
                  }
                }
              }
          """
          gpu = gpu[:sw_start] + sw_pre_inj + gpu[sw_start : sw_end + 1] + "\n    cmd = _leap_orig_cmd;" + gpu[sw_end + 1 :]
          with open(gpu_p, "w") as f:
              f.write(gpu)
          log_msg("SUCCESS 4A: Patched renderer_do_cmd_list() in gpulib_if.cpp (Gouraud->ARM ASM & Quad Simplifier fast path)!")

          # 4B. Hook vout_update() in plugins/gpulib/vout_pl.c for pure vout_ms telemetry
          vp = "plugins/gpulib/vout_pl.c"
          with open(vp, "r") as f:
              vt = f.read()
          m_vu = re.search(r"^((?:static\s+)?(?:int|void)\s+)vout_update\s*\(([^;{}]*)\)\s*\{", vt, flags=re.M)
          assert m_vu is not None, "Could not find vout_update in plugins/gpulib/vout_pl.c"
          v_ret, v_params = m_vu.group(1), m_vu.group(2)
          v_args = extract_c_arg_names(v_params)
          v_hdr = "#include <stdint.h>\nextern uint64_t leap_pcsx_us(void);\nextern void leap_pcsx_vout_enter(void);\nextern void leap_pcsx_vout_leave(uint32_t dt_us);\n"
          v_wrap = (
              f"static int leap_vout_update_inner({v_params});\n"
              f"{v_ret}vout_update({v_params}) {{\n"
              f"\tuint64_t _t0 = leap_pcsx_us();\n"
              f"\tleap_pcsx_vout_enter();\n"
              f"\tint _r = leap_vout_update_inner({v_args});\n"
              f"\tleap_pcsx_vout_leave((uint32_t)(leap_pcsx_us() - _t0));\n"
              f"\treturn _r;\n"
              f"}}\n"
              f"static int leap_vout_update_inner({v_params})\n{{"
          )
          with open(vp, "w") as f:
              f.write(v_hdr + vt[:m_vu.start()] + v_wrap + vt[m_vu.end():])
          log_msg("SUCCESS 4B: Hooked vout_update() in plugins/gpulib/vout_pl.c!")

          # 5A. Optimize 512->320 and 640->320 RGB565 downscalers in frontend/cspace.c using 32-bit word burst loads
          cs_p = "frontend/cspace.c"
          with open(cs_p, "r") as f:
              cs_txt = f.read()

          m_640 = re.search(r"^void\s+bgr555_to_rgb565_640_to_320\s*\([^;{}]*\)\s*\{", cs_txt, flags=re.M)
          assert m_640 is not None, "Could not find bgr555_to_rgb565_640_to_320 in frontend/cspace.c"
          b640_o = cs_txt.index("{", m_640.start())
          b640_c = find_matching_brace(cs_txt, b640_o)
          fast_640 = """void bgr555_to_rgb565_640_to_320(void * __restrict__ dst_,
          \tconst void * __restrict__ src_, int dpixels)
          {
          \tconst uint32_t * __restrict__ s32 = (const uint32_t *)((uintptr_t)src_ & ~(uintptr_t)3U);
          \tuint32_t * __restrict__ dst = (uint32_t *)dst_;
          \tfor (; dpixels >= 8; dpixels -= 8, s32 += 8, dst += 4) {
          \t\t__builtin_prefetch(s32 + 16);
          \t\tuint32_t a0 = LE32TOH(s32[0]), a1 = LE32TOH(s32[1]);
          \t\tuint32_t a2 = LE32TOH(s32[2]), a3 = LE32TOH(s32[3]);
          \t\tuint32_t a4 = LE32TOH(s32[4]), a5 = LE32TOH(s32[5]);
          \t\tuint32_t a6 = LE32TOH(s32[6]), a7 = LE32TOH(s32[7]);
          \t\tdst[0] = bgr555_to_rgb565_pair((a0 & 0xFFFFu) | (a1 << 16));
          \t\tdst[1] = bgr555_to_rgb565_pair((a2 & 0xFFFFu) | (a3 << 16));
          \t\tdst[2] = bgr555_to_rgb565_pair((a4 & 0xFFFFu) | (a5 << 16));
          \t\tdst[3] = bgr555_to_rgb565_pair((a6 & 0xFFFFu) | (a7 << 16));
          \t}
          \tfor (; dpixels >= 2; dpixels -= 2, s32 += 2, dst++) {
          \t\tuint32_t a0 = LE32TOH(s32[0]), a1 = LE32TOH(s32[1]);
          \t\t*dst = bgr555_to_rgb565_pair((a0 & 0xFFFFu) | (a1 << 16));
          \t}
          }"""
          cs_txt = cs_txt[:m_640.start()] + fast_640 + cs_txt[b640_c + 1 :]

          m_512 = re.search(r"^void\s+bgr555_to_rgb565_512_to_320\s*\([^;{}]*\)\s*\{", cs_txt, flags=re.M)
          assert m_512 is not None, "Could not find bgr555_to_rgb565_512_to_320 in frontend/cspace.c"
          b512_o = cs_txt.index("{", m_512.start())
          b512_c = find_matching_brace(cs_txt, b512_o)
          fast_512 = """void bgr555_to_rgb565_512_to_320(void * __restrict__ dst_,
          \tconst void * __restrict__ src_, int dpixels)
          {
          \tconst uint32_t * __restrict__ s32 = (const uint32_t *)((uintptr_t)src_ & ~(uintptr_t)3U);
          \tuint32_t * __restrict__ dst = (uint32_t *)dst_;
          \tfor (; dpixels >= 10; dpixels -= 10, s32 += 8, dst += 5) {
          \t\t__builtin_prefetch(s32 + 16);
          \t\tuint32_t w0 = LE32TOH(s32[0]), w1 = LE32TOH(s32[1]);
          \t\tuint32_t w2 = LE32TOH(s32[2]), w3 = LE32TOH(s32[3]);
          \t\tuint32_t w4 = LE32TOH(s32[4]), w5 = LE32TOH(s32[5]);
          \t\tuint32_t w6 = LE32TOH(s32[6]), w7 = LE32TOH(s32[7]);
          \t\tdst[0] = bgr555_to_rgb565_pair((w0 & 0xFFFFu) | (w1 << 16));
          \t\tdst[1] = bgr555_to_rgb565_pair(w2);
          \t\tdst[2] = bgr555_to_rgb565_pair((w3 >> 16) | (w4 << 16));
          \t\tdst[3] = bgr555_to_rgb565_pair((w5 & 0xFFFFu) | (w6 << 16));
          \t\tdst[4] = bgr555_to_rgb565_pair((w6 >> 16) | (w7 & 0xFFFF0000u));
          \t}
          }"""
          cs_txt = cs_txt[:m_512.start()] + fast_512 + cs_txt[b512_c + 1 :]
          with open(cs_p, "w") as f:
              f.write(cs_txt)
          log_msg("SUCCESS 5A: Optimized bgr555_to_rgb565_512_to_320 & 640_to_320 with 32-bit burst loads + prefetch!")

          # 5B. Set LeapsterGS-optimal defaults for Core Options in frontend/libretro_core_options.h (handles #if/#else blocks too!)
          opt_h_p = "frontend/libretro_core_options.h"
          if os.path.exists(opt_h_p):
              with open(opt_h_p, "r") as f:
                  opt_h = f.read()
              for key_name, new_def in [
                  ("pcsx_rearmed_scale_hires", "enabled"),
                  ("pcsx_rearmed_nostalls", "enabled"),
                  ("pcsx_rearmed_dithering", "disabled"),
              ]:
                  k_idx = opt_h.find(f'"{key_name}"')
                  if k_idx != -1:
                      open_b = opt_h.rfind("{", 0, k_idx)
                      close_b = find_matching_brace(opt_h, open_b)
                      entry = opt_h[open_b : close_b + 1]
                      vals_open = entry.find("{", entry.find(f'"{key_name}"'))
                      vals_close = find_matching_brace(entry, vals_open)
                      tail = entry[vals_close + 1 :]
                      tail_new, n_rep = re.subn(r'"(?:disabled|enabled|auto)"', f'"{new_def}"', tail)
                      if n_rep > 0:
                          opt_h = opt_h[:open_b] + entry[:vals_close + 1] + tail_new + opt_h[close_b + 1 :]
                          log_msg(f"SUCCESS 5B: Set default {key_name} = '{new_def}' in libretro_core_options.h!")
              with open(opt_h_p, "w") as f:
                  f.write(opt_h)

          # 5C. Patch frontend/libretro.c:
          #     - UNLOCK Config.cycle_multiplier (respects Auto=175 [57%] and .opt pcsx_rearmed_psxclock!)
          #     - Bypass GET_CURRENT_SOFTWARE_FRAMEBUFFER in set_vout_fb() so vout_buf stays in fast L1/L2 cache (fixes 6ms vcb_ms lock contention!)
          #     - Constant-pitch step_fp = 70000 (41,288 Hz) linear resampler + 1s telemetry
          with open("frontend/libretro.c", "r") as f:
              lr = f.read()

          lr, n_fb = re.subn(
              r"ret\s*=\s*environ_cb\s*\(\s*RETRO_ENVIRONMENT_GET_CURRENT_SOFTWARE_FRAMEBUFFER\s*,\s*&fb\s*\)\s*;",
              "ret = false; (void)fb;",
              lr, count=1
          )
          assert n_fb == 1, "Could not patch GET_CURRENT_SOFTWARE_FRAMEBUFFER in set_vout_fb()"
          log_msg("SUCCESS 5C-FB: Disabled slow cross-thread GET_CURRENT_SOFTWARE_FRAMEBUFFER lock in set_vout_fb()!")

          cm_ident_expr = "Config.cycle_multiplier" if "Config.cycle_multiplier" in lr else "175"

          v64_runtime = """
          #include <stdio.h>
          #include <string.h>
          #include <stdint.h>
          #include <time.h>
          #ifndef CLOCK_MONOTONIC
          #define CLOCK_MONOTONIC 1
          #endif

          uint32_t g_frame_polys = 0;
          uint32_t g_last_frame_polys = 0;
          uint32_t g_allow_menu_light = 0;

          static retro_video_refresh_t g_leap_orig_vid = NULL;
          static retro_audio_sample_batch_t g_leap_orig_aud = NULL;

          static FILE *g_ptfp = NULL;
          static volatile int g_in_retro_run = 0;
          static int g_in_vout = 0, g_in_spu = 0;
          static uint64_t g_p_win_u = 0, g_p_pre_u = 0, g_p_emu_u = 0;
          static uint32_t g_p_sec = 0, g_p_vbl = 0, g_p_vreal = 0, g_p_vdup = 0;
          static unsigned g_p_vw = 0, g_p_vh = 0, g_p_last_vw = 0, g_p_last_vh = 0;
          static size_t g_p_vpitch = 0, g_p_last_vpitch = 0;
          static uint32_t g_p_max_polys = 0;
          static uint32_t g_p_gpu_u = 0, g_p_vout_u = 0, g_p_vcb_u = 0, g_p_vcb_in_vout_u = 0;
          static uint32_t g_p_cd_u = 0, g_p_cd_main_u = 0, g_p_cd_cnt = 0;
          static uint32_t g_p_spu_u = 0, g_p_blk_u = 0, g_p_blk_in_spu_u = 0;
          static uint32_t g_p_in_aud_f = 0, g_p_max_b = 0;

          static int16_t g_rs_out[1024 * 2] __attribute__((aligned(16)));
          static uint32_t s_rs_pos = 0;
          static int s_rs_prev_l = 0, s_rs_prev_r = 0;

          uint64_t leap_pcsx_us(void) {
             struct timespec ts;
             clock_gettime(CLOCK_MONOTONIC, &ts);
             return (uint64_t)ts.tv_sec * 1000000ULL + (uint64_t)(ts.tv_nsec / 1000ULL);
          }

          static void leap_pcsx_open_log(void) {
             if (!g_ptfp) {
                g_ptfp = fopen("/tmp/pcsx_telemetry.log", "w");
                if (g_ptfp) {
                   fprintf(g_ptfp, "=== PCSX-ReARMed LeapsterGS V64 (2026 Master + Unlocked Clock + Cached 320w + Gouraud ASM) ===\\n");
                   fprintf(g_ptfp, "sec | wall | emu_ms | vbl | v_r/d  | res         | clk | polys | cpu_ms | gpu_ms | vout_ms | vcb_ms | cd_ms(c)  | spu_ms | aud_ms | max_b | blk_ms\\n");
                   fflush(g_ptfp);
                }
             }
          }

          void leap_pcsx_add_gpu(uint32_t dt_us) { __sync_fetch_and_add(&g_p_gpu_u, dt_us); }
          void leap_pcsx_vout_enter(void) { g_in_vout = 1; }
          void leap_pcsx_vout_leave(uint32_t dt_us) { g_in_vout = 0; __sync_fetch_and_add(&g_p_vout_u, dt_us); }
          void leap_pcsx_spu_enter(void) { g_in_spu = 1; }
          void leap_pcsx_spu_leave(uint32_t dt_us) { g_in_spu = 0; __sync_fetch_and_add(&g_p_spu_u, dt_us); }
          void leap_pcsx_add_cd(uint32_t dt_us) {
             __sync_fetch_and_add(&g_p_cd_u, dt_us);
             __sync_fetch_and_add(&g_p_cd_cnt, 1U);
             if (g_in_retro_run) __sync_fetch_and_add(&g_p_cd_main_u, dt_us);
          }

          static void leap_pcsx_vid_cb(const void *data, unsigned width, unsigned height, size_t pitch) {
             if (data != NULL) {
                g_p_vreal++;
                g_p_vw = width;
                g_p_vh = height;
                g_p_vpitch = pitch;
                if (width != g_p_last_vw || height != g_p_last_vh || pitch != g_p_last_vpitch) {
                   g_p_last_vw = width;
                   g_p_last_vh = height;
                   g_p_last_vpitch = pitch;
                   leap_pcsx_open_log();
                   if (g_ptfp && g_p_sec <= 600) {
                      unsigned bpp = (width > 0 && pitch >= width * 4U) ? 32U : 16U;
                      fprintf(g_ptfp, "[MODE] res=%ux%u pitch=%zu bpp=%u scale_hires=%d nostalls=%d clk=%d\\n",
                              width, height, pitch, bpp, (int)pl_rearmed_cbs.scale_hires, (int)Config.DisableStalls, (int)Config.cycle_multiplier);
                      fflush(g_ptfp);
                   }
                }
             } else {
                g_p_vdup++;
             }
             if (g_leap_orig_vid) {
                uint64_t t0 = leap_pcsx_us();
                g_leap_orig_vid(data, width, height, pitch);
                uint32_t dt = (uint32_t)(leap_pcsx_us() - t0);
                g_p_vcb_u += dt;
                if (g_in_vout) g_p_vcb_in_vout_u += dt;
             }
          }

          static size_t leap_pcsx_aud_cb(const int16_t *data, size_t frames) {
             if (!g_leap_orig_aud || !data || frames == 0) return frames;
             uint32_t in_f = (uint32_t)frames;
             __sync_fetch_and_add(&g_p_in_aud_f, in_f);
             if (in_f > g_p_max_b) g_p_max_b = in_f;

             /* Constant 44,100 Hz -> 41,288 Hz linear resampler (step_fp = 70000): zero pitch shift, phase-continuous */
             const uint32_t step_fp = 70000U;
             uint32_t in_pos = s_rs_pos;
             uint32_t idx = in_pos >> 16;
             uint64_t blk_tot = 0;

             while (idx < in_f) {
                uint32_t out_f = 0;
                while (idx < in_f && out_f < 1020U) {
                   uint32_t frac = in_pos & 0xFFFFU;
                   int l0 = (idx == 0U) ? s_rs_prev_l : (int)data[(idx - 1U) * 2U];
                   int r0 = (idx == 0U) ? s_rs_prev_r : (int)data[(idx - 1U) * 2U + 1U];
                   int l1 = (int)data[idx * 2U];
                   int r1 = (int)data[idx * 2U + 1U];
                   g_rs_out[out_f * 2U]     = (int16_t)(l0 + (((l1 - l0) * (int)frac) >> 16));
                   g_rs_out[out_f * 2U + 1U] = (int16_t)(r0 + (((r1 - r0) * (int)frac) >> 16));
                   out_f++;
                   in_pos += step_fp;
                   idx = in_pos >> 16;
                }
                if (out_f > 0U) {
                   uint64_t t0 = leap_pcsx_us();
                   g_leap_orig_aud(g_rs_out, out_f);
                   blk_tot += leap_pcsx_us() - t0;
                }
             }

             s_rs_prev_l = (int)data[(in_f - 1U) * 2U];
             s_rs_prev_r = (int)data[(in_f - 1U) * 2U + 1U];
             s_rs_pos = in_pos - (in_f << 16);

             uint32_t blk_dt = (uint32_t)blk_tot;
             __sync_fetch_and_add(&g_p_blk_u, blk_dt);
             if (g_in_spu) g_p_blk_in_spu_u += blk_dt;
             return frames;
          }

          static void leap_pcsx_pre(void) {
             g_in_retro_run = 1;
             g_p_pre_u = leap_pcsx_us();
             if (!g_p_win_u) {
                leap_pcsx_open_log();
                g_p_win_u = g_p_pre_u;
             }
          }

          static void leap_pcsx_post(int cur_clk) {
             g_in_retro_run = 0;
             uint64_t u = leap_pcsx_us();
             uint32_t run_u = (g_p_pre_u && u > g_p_pre_u) ? (uint32_t)(u - g_p_pre_u) : 0U;
             g_p_emu_u += run_u;
             if (g_frame_polys > g_p_max_polys) g_p_max_polys = g_frame_polys;
             g_p_vbl++;

             if (u - g_p_win_u >= 1000000ULL) {
                g_p_sec++;
                uint32_t wm = (uint32_t)((u - g_p_win_u) / 1000ULL);
                uint32_t emu_u = (uint32_t)g_p_emu_u;
                uint32_t gpu_u = __sync_lock_test_and_set(&g_p_gpu_u, 0);
                uint32_t vout_tot = __sync_lock_test_and_set(&g_p_vout_u, 0);
                uint32_t vcb_u = g_p_vcb_u; g_p_vcb_u = 0;
                uint32_t vcb_in = g_p_vcb_in_vout_u; g_p_vcb_in_vout_u = 0;
                uint32_t pure_vout_u = (vout_tot > vcb_in) ? (vout_tot - vcb_in) : 0;
                uint32_t cd_u = __sync_lock_test_and_set(&g_p_cd_u, 0);
                uint32_t cd_cnt = __sync_lock_test_and_set(&g_p_cd_cnt, 0);
                uint32_t cd_main_u = __sync_lock_test_and_set(&g_p_cd_main_u, 0);
                uint32_t spu_tot = __sync_lock_test_and_set(&g_p_spu_u, 0);
                uint32_t blk_u = __sync_lock_test_and_set(&g_p_blk_u, 0);
                uint32_t blk_in = g_p_blk_in_spu_u; g_p_blk_in_spu_u = 0;
                uint32_t pure_spu_u = (spu_tot > blk_in) ? (spu_tot - blk_in) : 0;
                uint32_t in_aud_f = __sync_lock_test_and_set(&g_p_in_aud_f, 0);

                uint32_t sub_u = gpu_u + pure_vout_u + vcb_u + cd_main_u + pure_spu_u + blk_u;
                uint32_t cpu_u = (emu_u > sub_u) ? (emu_u - sub_u) : 0;

                if (g_ptfp && g_p_sec <= 600) {
                   unsigned bpp = (g_p_vw > 0 && g_p_vpitch >= g_p_vw * 4U) ? 32U : 16U;
                   char rbuf[20], vrbuf[16], cdbuf[16];
                   snprintf(rbuf, sizeof(rbuf), "%ux%ux%u", g_p_vw, g_p_vh, bpp);
                   snprintf(vrbuf, sizeof(vrbuf), "%u/%u", g_p_vreal, g_p_vdup);
                   snprintf(cdbuf, sizeof(cdbuf), "%u(%u)", cd_u / 1000U, cd_cnt);
                   fprintf(g_ptfp, "%3u | %4u | %6u | %3u | %-6s | %-11s | %3d | %5u | %6u | %6u | %7u | %6u | %-9s | %6u | %6u | %5u | %6u\\n",
                           g_p_sec, wm, emu_u / 1000U, g_p_vbl, vrbuf, rbuf, cur_clk, g_p_max_polys,
                           cpu_u / 1000U, gpu_u / 1000U, pure_vout_u / 1000U, vcb_u / 1000U, cdbuf,
                           pure_spu_u / 1000U, (in_aud_f * 1000U) / 44100U, g_p_max_b, blk_u / 1000U);
                   fflush(g_ptfp);
                }
                g_p_win_u = u;
                g_p_emu_u = 0;
                g_p_vbl = g_p_vreal = g_p_vdup = g_p_max_polys = g_p_max_b = 0;
             }
          }
          """

          pos_first_cb = min(
              re.search(pat, lr).start()
              for pat in [
                  r"void\s+retro_set_video_refresh\b",
                  r"void\s+retro_set_audio_sample_batch\b",
                  r"bool\s+retro_load_game\b",
                  r"void\s+retro_run\b",
              ]
          )
          lr = lr[:pos_first_cb] + v64_runtime + "\n" + lr[pos_first_cb:]

          lr, n_vid = re.subn(
              r"(void\s+retro_set_video_refresh\s*\(\s*retro_video_refresh_t\s+(\w+)\s*\)\s*\{)",
              r"\1 g_leap_orig_vid = \2; \2 = leap_pcsx_vid_cb;",
              lr, count=1
          )
          lr, n_aud = re.subn(
              r"(void\s+retro_set_audio_sample_batch\s*\(\s*retro_audio_sample_batch_t\s+(\w+)\s*\)\s*\{)",
              r"\1 g_leap_orig_aud = \2; \2 = leap_pcsx_aud_cb;",
              lr, count=1
          )
          assert n_vid == 1 and n_aud == 1, f"Failed Libretro cb hooks: {n_vid},{n_aud}"

          def build_load_inj(m):
              hdr_open, p_var = m.group(1), m.group(2)
              return (
                  f"{hdr_open}\n"
                  f"   g_allow_menu_light = 0;\n"
                  f"   g_frame_polys = 0;\n"
                  f"   g_last_frame_polys = 0;\n"
                  f"   s_rs_pos = 0;\n"
                  f"   s_rs_prev_l = 0;\n"
                  f"   s_rs_prev_r = 0;\n"
                  f"   leap_pcsx_open_log();\n"
                  f"   if ({p_var} && {p_var}->path) {{\n"
                  f"      if (g_ptfp) {{\n"
                  f"         fprintf(g_ptfp, \"[LOAD] path='%s'\\n\", {p_var}->path);\n"
                  f"         fflush(g_ptfp);\n"
                  f"      }}\n"
                  f"      if (strstr({p_var}->path, \"Dora\") != NULL || strstr({p_var}->path, \"dora\") != NULL ||\n"
                  f"          strstr({p_var}->path, \"102\") != NULL || strstr({p_var}->path, \"Dalmatian\") != NULL || strstr({p_var}->path, \"dalmatian\") != NULL) {{\n"
                  f"         g_allow_menu_light = 1;\n"
                  f"      }}\n"
                  f"   }}"
              )

          lr, n_load = re.subn(
              r"(bool\s+retro_load_game\s*\(\s*const\s+struct\s+retro_game_info\s*\*\s*(\w+)\s*\)\s*\{)",
              build_load_inj,
              lr, count=1
          )
          assert n_load == 1, "Could not find retro_load_game in libretro.c"

          m_run = re.search(r"void\s+retro_run\s*\(\s*(?:void)?\s*\)\s*\{", lr)
          assert m_run is not None, "Could not find retro_run in libretro.c"
          r_bs = m_run.end() - 1
          r_be = find_matching_brace(lr, r_bs)

          run_entry = (
              "\n   leap_pcsx_pre();\n"
              "   if (g_frame_polys > 0) {\n"
              "      g_last_frame_polys = g_frame_polys;\n"
              "   }\n"
              "   g_frame_polys = 0;\n"
          )
          lr = lr[:r_bs + 1] + run_entry + lr[r_bs + 1 : r_be] + f"\n   leap_pcsx_post((int)({cm_ident_expr}));\n" + lr[r_be:]

          with open("frontend/libretro.c", "w") as f:
              f.write(lr)
          log_msg("SUCCESS 5C: Patched frontend/libretro.c (Unlocked PSX Clock + Cached Vout + Fixed 41.29kHz Resampler + Telemetry)!")

          with open("../build_v64_report.txt", "a") as rf:
              rf.write("=== PCSX-ReARMed V64 PATCH SUMMARY ===\n")
              for line in report_lines:
                  rf.write(line + "\n")
          EOF

      - name: Compile Inside Ubuntu 18.04 Container (GLIBC <= 2.17 + Cortex-A9 CLZ/SMULL + Stripped .so)
        run: |
          docker run --rm -v "$PWD:/work" -w /work/pcsx_src ubuntu:18.04 bash -c '
            set -e -o pipefail
            apt-get update
            apt-get install -y git gcc-arm-linux-gnueabi g++-arm-linux-gnueabi binutils-arm-linux-gnueabi make
            OPT_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fno-strict-aliasing -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            export CFLAGS="$OPT_FLAGS"
            export CXXFLAGS=""
            export LDFLAGS="-Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc"
            make -f Makefile.libretro \
              V=1 \
              platform=unix \
              ARCH=arm \
              CC="arm-linux-gnueabi-gcc" \
              CXX="arm-linux-gnueabi-g++ -static-libstdc++ -static-libgcc" \
              DYNAREC=ari64 \
              BUILTIN_GPU=unai \
              GPU_UNAI_NO_OLD=1 \
              HAVE_CHD=1 \
              USE_MINIZ=1 \
              HAVE_NEON=0 \
              HAVE_NEON_ASM=0 \
              HAVE_PHYSICAL_CDROM=0 \
              USE_ASYNC_CDROM=0 \
              USE_ASYNC_GPU=0 \
              USE_ASYNC_SPU=0 \
              NDRC_THREAD=0 \
              -j$(nproc) 2>&1 | tee ../build_v64.log
            echo "=== KEY COMPILER FLAGS AUDIT ===" >> ../build_v64_report.txt
            grep -E "gpulib_if\.cpp|gpu_arm\.S|gte_nf_arm\.S|prim\.c|libretro\.c|cspace\.c|cspace_arm\.S" ../build_v64.log | head -n 24 >> ../build_v64_report.txt || true
            echo "=== RECIPROCAL TABLE s_invTable SYMBOL AUDIT ===" >> ../build_v64_report.txt
            arm-linux-gnueabi-nm plugins/gpu_unai/gpulib_if.o | grep "s_invTable" >> ../build_v64_report.txt || true
            echo "=== GLIBC VERSIONS ===" >> ../build_v64_report.txt
            arm-linux-gnueabi-objdump -T pcsx_rearmed_libretro.so | grep -o "GLIBC_[0-9.]*" | sort -uV >> ../build_v64_report.txt || true
            echo "=== BINARY SIZE (UNSTRIPPED -> STRIPPED) ===" >> ../build_v64_report.txt
            ls -lh pcsx_rearmed_libretro.so >> ../build_v64_report.txt
            arm-linux-gnueabi-strip -s pcsx_rearmed_libretro.so
            ls -lh pcsx_rearmed_libretro.so >> ../build_v64_report.txt
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
          '
          ls -lh pcsx_rearmed_libretro.so build_v64.log build_v64_report.txt

      - name: Upload V64 Core + Build Log + Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx_rearmed_libretro_v64
          path: |
            pcsx_rearmed_libretro.so
            build_v64.log
            build_v64_report.txt
