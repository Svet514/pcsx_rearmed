name: Build PCSX-ReARMed v17 44100Hz-Uncapped + v13-GPU + SPU-Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Official b1226a3a & Apply v17 Patches
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout b1226a3ab49a2e82e55a7123eb68fded56091044

          # 1. Add scph5502.bin to BIOS list
          sed -i 's/"scph5501.bin"/"scph5502.bin", "scph5501.bin"/g' frontend/libretro.c

          cat << 'EOF' > patch_v17.py
          import re
          import sys

          # --- 1. KEEP gpu_inner_light_arm.h 100% STOCK (LIKE V13) SO NO BRANCH PENALTY IN SESAME STREET! ---
          print("SUCCESS 1: Kept gpu_inner_light_arm.h 100% stock (restores v13 polygon speed)!")

          # --- 2. REMOVE THE 46.88 FPS CAP AT 44100Hz BY GENERATING 820 SAMPLES/FRAME (41000Hz) IN SPU & XA ---
          # RetroArch still sees 44100Hz -> 44100Hz (so 0 resampling and 0 crackling!),
          # while tinyalsa drains 820 samples in 19.9ms instead of 882 samples in 21.4ms -> unlocks 50.00 FPS!
          with open("plugins/dfsound/spu.c", "r") as f:
              spu_c = f.read()

          print("=== SPU.C LINES AROUND flags & 1 AND SPU_async ===")
          for i, line in enumerate(spu_c.splitlines()):
              if "flags & 1" in line or "44100" in line or "SPU_async" in line or "do_samples" in line:
                  start = max(0, i - 10)
                  end = min(len(spu_c.splitlines()), i + 15)
                  print(f"--- Line {i+1} ---")
                  print("\n".join(spu_c.splitlines()[start:end]))

          # Change 44100 sample generation rate in plugins/dfsound/spu.c and libpcsxcore/decode_xa.c to 41000
          spu_c_patched = spu_c.replace("44100", "41000")
          with open("plugins/dfsound/spu.c", "w") as f:
              f.write(spu_c_patched)

          with open("libpcsxcore/decode_xa.c", "r") as f:
              dec_xa = f.read()
          dec_xa_patched = dec_xa.replace("44100", "41000")
          with open("libpcsxcore/decode_xa.c", "w") as f:
              f.write(dec_xa_patched)
          print("SUCCESS 2: Uncapped 44100Hz framerate from 46.6 FPS to 50.0 FPS in spu.c & decode_xa.c!")

          # --- 3. KEEP CLEAN CHANNEL 255 FIRSTSECTOR FIX IN libpcsxcore/cdrom.c ---
          with open("libpcsxcore/cdrom.c", "r") as f:
              cdrom = f.read()

          old_lock = (
              "\t\tif( cdr.FirstSector == 1 && (cdr.Mode & MODE_SF)==0 ) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t}"
          )
          new_lock = (
              "\t\tif (cdr.FirstSector == 1 && (cdr.Mode & MODE_SF) == 0 && (cdr.Transfer[4 + 2] & 0x4) && cdr.Transfer[4 + 1] != 255) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t}"
          )
          if old_lock in cdrom:
              cdrom = cdrom.replace(old_lock, new_lock, 1)
              with open("libpcsxcore/cdrom.c", "w") as f:
                  f.write(cdrom)
              print("SUCCESS 3: Applied Channel 255 FirstSector fix to cdrom.c!")
          EOF

          python3 patch_v17.py > ../build_v17_report.txt
          rm -f patch_v17.py

          # Optimize Makefiles
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile

          echo "=== VERIFIED GIT DIFF FOR V17 ===" >> ../build_v17_report.txt
          git diff libpcsxcore/cdrom.c libpcsxcore/decode_xa.c plugins/dfsound/spu.c >> ../build_v17_report.txt

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            A9_V17_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -fno-tree-vectorize -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fgcse-sm -fgcse-las -fipa-pta -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$A9_V17_FLAGS"
            export CXXFLAGS="$A9_V17_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $A9_V17_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $A9_V17_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_v17.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
            ls -lh ../pcsx_rearmed_libretro.so >> ../build_v17_report.txt
          '
          cat build_v17_report.txt

      - name: Upload v17 .so File & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-v17-uncapped-44100
          path: |
            pcsx_rearmed_libretro.so
            build_v17_report.txt
            build_v17.log
