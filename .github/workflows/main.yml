name: Build PCSX-ReARMed Ultimate + Complete Blues Clues CDROM Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout d2b40c8 & Patch libpcsxcore/cdrom.c for Channel 255
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout d2b40c8
          git submodule update --init

          cat << 'EOF' > patch_cdrom.py
          import re

          with open("libpcsxcore/cdrom.c", "r") as f:
              code = f.read()

          lines = code.splitlines()
          for i, line in enumerate(lines):
              if "cdr.Transfer[4 + 1]" in line or "xa_decode_sector" in line:
                  start = max(0, i - 10)
                  end = min(len(lines), i + 25)
                  print("=== ORIGINAL CDROM.C LINES ===")
                  print("\n".join(lines[start:end]))
                  break

          # 1. Prevent Channel 255 (0xff) dummy sectors from locking cdr.Channel or consuming cdr.FirstSector
          new_lock = (
              "if (cdr.Transfer[4 + 1] == 0xff) {\n"
              "\t\t\t/* Ignore dummy channel 255 sector */\n"
              "\t\t} else if (cdr.FirstSector == 1 || cdr.Channel == 0xff) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t\tcdr.FirstSector = 1;\n"
              "\t\t}"
          )

          code, count = re.subn(
              r"if\s*\(\s*cdr\.FirstSector\s*==\s*1\s*\)\s*\{\s*cdr\.File\s*=\s*cdr\.Transfer\[4\s*\+\s*0\];\s*cdr\.Channel\s*=\s*cdr\.Transfer\[4\s*\+\s*1\];\s*\}",
              new_lock,
              code,
              count=1
          )
          print(f"Patched cdr.FirstSector lock: {count} match(es)")

          # 2. Ensure xa_decode_sector check also ignores channel 255 (0xff)
          old_xa = "(cdr.Transfer[4 + 0] == cdr.File))"
          new_xa = "(cdr.Transfer[4 + 0] == cdr.File) && (cdr.Channel != 0xff) && (cdr.Transfer[4 + 1] != 0xff))"
          if old_xa in code:
              code = code.replace(old_xa, new_xa, 1)
              print("Successfully patched xa_decode_sector check in cdrom.c!")

          with open("libpcsxcore/cdrom.c", "w") as f:
              f.write(code)

          # 3. Also keep the guard inside decode_xa.c as a second layer of protection
          with open("libpcsxcore/decode_xa.c", "r") as f:
              xa_code = f.read()
          target = "xdp->nbits = 4;"
          patch = "if (sectorp[1] == 0xff) return -1;\n\txdp->nbits = 4;"
          if "sectorp[1] == 0xff" not in xa_code and target in xa_code:
              xa_code = xa_code.replace(target, patch, 1)
              with open("libpcsxcore/decode_xa.c", "w") as f:
                  f.write(xa_code)
              print("Successfully patched decode_xa.c!")
          EOF

          python3 patch_cdrom.py > ../blues_clues_cdrom_report.txt
          rm -f patch_cdrom.py

          echo "=== VERIFY GIT DIFF ON CDROM.C & DECODE_XA.C ===" >> ../blues_clues_cdrom_report.txt
          git diff >> ../blues_clues_cdrom_report.txt

          # 1. Force -O3 everywhere
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile

          # 2. Statically link libstdc++ and libgcc
          sed -i 's/-shared/-shared -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -static-libstdc++ -static-libgcc/g' Makefile

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            ULTIMATE_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -munaligned-access -O3 -funroll-loops -fpeel-loops -ftracer -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -ftree-vectorize -fprefetch-loop-arrays --param l1-cache-size=32 --param l1-cache-line-size=32 --param l2-cache-size=128 -fno-plt -fno-semantic-interposition -fgcse-sm -fgcse-las -fipa-pta -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$ULTIMATE_FLAGS"
            export CXXFLAGS="$ULTIMATE_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $ULTIMATE_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $ULTIMATE_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_blues_clues_v2.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
          '
          cat blues_clues_cdrom_report.txt

      - name: Upload Ready-to-Use .so File & CDROM Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-blues-clues-v2
          path: |
            pcsx_rearmed_libretro.so
            blues_clues_cdrom_report.txt
            build_blues_clues_v2.log
