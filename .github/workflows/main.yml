          log_msg("SUCCESS 4C: Patched gpulib_if.cpp (Main/Pause Menu UI Lighting + Unlit 3D World Speed + Opaque-Only Load Fade Guard)!")

          # 4D. Hook vout_update() in plugins/gpulib/vout_pl.c for pure vout_ms telemetry
          vp = "plugins/gpulib/vout_pl.c"
          with open(vp, "r") as f:
