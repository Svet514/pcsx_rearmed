              "              const u32 g = (((c0 >> 8) & 0xFFu) + ((c1 >> 8) & 0xFFu) + ((c2 >> 8) & 0xFFu) + ((c3 >> 8) & 0xFFu) + 2u) >> 2;\n"
              "              const u32 b = (((c0 >> 16) & 0xFFu) + ((c1 >> 16) & 0xFFu) + ((c2 >> 16) & 0xFFu) + ((c3 >> 16) & 0xFFu) + 2u) >> 2;\n"
