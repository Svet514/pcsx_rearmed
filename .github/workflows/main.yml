          m_vfl = re.search(r"^static\s+void\s+vout_flip\s*\(([^;{}]*)\)\s*\{", lr, flags=re.M)
          assert m_vfl is not None
          vfl_b = lr.index("{", m_vfl.start())
          vfl_fast = (
              "\n   extern uint8_t g_v72_buf_320[4];\n"
              "   if (vram_ != NULL && current_fmt == RETRO_PIXEL_FORMAT_RGB565 &&\n"
              "       pl_rearmed_cbs.scale_hires && w > 0 && h > 0 &&\n"
              "       (in_enable_crosshair[0] + in_enable_crosshair[1]) == 0) {\n"
              "      int _sy0 = (vram_ofs >> 11) & 0x1ff;\n"
              "      int _sx0 = (vram_ofs >> 1) & 0x3ff;\n"
              "      unsigned _bi = (((unsigned)_sy0 >= 192u) ? 2u : 0u) | (((unsigned)_sx0 >= 480u) ? 1u : 0u);\n"
              "      int _is320 = (!bgr24 && vout_width == 320 && psx_w >= 508 && psx_w <= 516 && g_v72_buf_320[_bi]);\n"
              "      if (_is320 || vout_height == 240) {\n"
              "         if (dims_changed) memset(vout_buf_ptr, 0, vout_pitch_b * vout_height);\n"
              "         bgr_to_fb_func *_row_fn = _is320 ? bgr555_to_rgb565 : pl_rearmed_cbs.cspace_blit;\n"
              "         int _src_h = (h > 256) ? (h >> 1) : h;\n"
              "         int _row_step = (h > 256) ? 4096 : 2048;\n"
              "         int _out_h = (_src_h > vout_height) ? vout_height : _src_h;\n"
              "         int _y_pad = (y > 0 && _out_h < vout_height) ? y : 0;\n"
              "         if (_y_pad + _out_h > vout_height) _out_h = vout_height - _y_pad;\n"
              "         int _x_pix = x, _w_out = w;\n"
              "         if (_is320) {\n"
              "            _x_pix = (x * 5) >> 3;\n"
              "            _w_out = (((w * 5) >> 3) + 7) & ~7;\n"
