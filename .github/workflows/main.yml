name: Build PCSX-ReARMed V41 (Zero-Frameskip Post-Mix Audio Cushion)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM32 Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make git python3

      - name: Apply V41 Post-Mix Audio Stretcher & Build Fixes
        run: |
          python3 - << 'EOF'
          import os, re

          # 0. Ensure config.h exists in root directory for -I.
          if not os.path.exists("config.h"):
              with open("config.h", "w") as f:
                  f.write("/* autogenerated config.h */\n")
              print("SUCCESS 0: Created config.h in repo root!")

          # 1. Patch Makefile: Replace HAVE_CHD block using balanced if/endif depth counter
          with open("Makefile", "r") as f:
              mk_lines = f.read().splitlines(keepends=True)

          chd_block = """ifeq "$(HAVE_CHD)" "1"
          CFLAGS += -Ideps/libchdr/include -Ideps/libchdr/include/libchdr -Ideps/libchdr/src -Ideps/libchdr/deps/lzma-26.02/include -Ideps/libchdr/deps/zstd-1.5.7 -Ideps/libchdr/deps/zlib-1.2.11 -Ideps/libchdr/deps/miniz-3.1.2 -Ideps/libchdr/deps/lzma-26.02/include/real -DHAVE_CHD -D_7ZIP_ST -DCHDR_SYSTEM_ZLIB
          CHD_OBJS = deps/libchdr/src/libchdr_bitstream.o \\
          \tdeps/libchdr/src/libchdr_cdrom.o \\
          \tdeps/libchdr/src/libchdr_chd.o \\
          \tdeps/libchdr/src/libchdr_codec_avhuff.o \\
          \tdeps/libchdr/src/libchdr_codec_cdfl.o \\
          \tdeps/libchdr/src/libchdr_codec_cdlz.o \\
          \tdeps/libchdr/src/libchdr_codec_cdzl.o \\
          \tdeps/libchdr/src/libchdr_codec_cdzs.o \\
          \tdeps/libchdr/src/libchdr_codec_flac.o \\
          \tdeps/libchdr/src/libchdr_codec_huff.o \\
          \tdeps/libchdr/src/libchdr_codec_lzma.o \\
          \tdeps/libchdr/src/libchdr_codec_zlib.o \\
          \tdeps/libchdr/src/libchdr_codec_zstd.o \\
          \tdeps/libchdr/src/libchdr_flac.o \\
          \tdeps/libchdr/src/libchdr_huffman.o \\
          \tdeps/libchdr/deps/lzma-26.02/src/LzmaDec.o \\
          \tdeps/libchdr/deps/zstd-1.5.7/zstddeclib.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/adler32.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/compress.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/crc32.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/deflate.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/gzclose.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/gzlib.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/gzread.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/gzwrite.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/infback.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/inffast.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/inflate.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/inftrees.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/trees.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/uncompr.o \\
          \tdeps/libchdr/deps/zlib-1.2.11/zutil.o
          $(CHD_OBJS): CFLAGS += -O3 -munaligned-access -Wno-unused -Wno-unused-function -Wno-deprecated-declarations
          OBJS += $(CHD_OBJS)
          endif
          """

          opt_flags = "-I. -march=armv7-a -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -munaligned-access -O3 -funroll-loops -fpeel-loops -ftracer -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fgcse-sm -fgcse-las -fipa-pta -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"

          extra_mk_flags = f"""
          CFLAGS += {opt_flags}
          CXXFLAGS += {opt_flags} -static-libstdc++ -static-libgcc
          LDFLAGS += -static-libstdc++ -static-libgcc -Wl,-Bsymbolic -Wl,-Bsymbolic-functions
          """

          out_lines = []
          i = 0
          patched_chd = False
          while i < len(mk_lines):
              s = mk_lines[i].strip()
              if not patched_chd and re.match(r'^ifeq\s+"?\$\(HAVE_CHD\)"?\s+"?1"?', s):
                  depth = 1
                  i += 1
                  while i < len(mk_lines) and depth > 0:
                      st = mk_lines[i].strip()
                      if re.match(r'^(ifeq|ifneq|ifdef|ifndef)\b', st):
                          depth += 1
                      elif re.match(r'^endif\b', st):
                          depth -= 1
                      i += 1
                  out_lines.append(chd_block)
                  out_lines.append(extra_mk_flags)
                  patched_chd = True
              else:
                  out_lines.append(mk_lines[i].replace("CFLAGS += -O2 -DNDEBUG", "CFLAGS += -O3 -DNDEBUG"))
                  i += 1

          assert patched_chd, "Failed to find HAVE_CHD block in Makefile"
          with open("Makefile", "w") as f:
              f.writelines(out_lines)
          print("SUCCESS 1: Patched Makefile with balanced HAVE_CHD block and OPT_FLAGS!")

          # 2. Patch plugins/dfsound/spu.c:
          #    - Keep do_samples() at native 768 cycles/sample so XAPlay/XAFeed never desync
          #    - Add post-mix linear-interpolated time-stretcher + ALSA buffer cushion controller
          with open("plugins/dfsound/spu.c", "r") as f:
              spu = f.read()

          spu_header = """#include <sys/time.h>
          #include <stdint.h>
          #include <stdio.h>
          static int16_t g_stretch_buf[2400 * 2];
          static struct timeval g_before_feed_tv = {0, 0};
          static struct timeval g_after_feed_tv = {0, 0};
          static struct timeval g_sec_tv = {0, 0};
          static uint32_t g_last_feed_us = 0;
          static uint32_t g_emu_hist[8] = {20000, 20000, 20000, 20000, 20000, 20000, 20000, 20000};
          static int g_hist_idx = 0;
          static int g_refill_frames = 20;
          static FILE *g_tlog = NULL;
          static uint32_t g_sec_frames = 0, g_sec_in_samples = 0, g_sec_out_samples = 0;
          static uint64_t g_sec_emu_us = 0, g_sec_feed_us = 0;
          """

          new_feed = """ if (flags & 1) {
            int bytes_to_feed = (unsigned char *)spu.pS - spu.pSpuBuffer;
            int n_in = bytes_to_feed >> 2;
            spu.pS = (short *)spu.pSpuBuffer;
            if (n_in > 0) {
             struct timeval now_tv;
             gettimeofday(&now_tv, NULL);
             uint32_t nom_us = ((uint32_t)n_in * 1000000U) / 44100U;
             uint32_t emu_us = nom_us;
             if (g_after_feed_tv.tv_sec != 0) {
              long d_us = (now_tv.tv_sec - g_after_feed_tv.tv_sec) * 1000000L + (now_tv.tv_usec - g_after_feed_tv.tv_usec);
              if (d_us > 0) emu_us = (uint32_t)d_us;
             } else {
              for (int k = 0; k < 8; k++) g_emu_hist[k] = nom_us;
              g_refill_frames = 20;
              g_sec_tv = now_tv;
              if (!g_tlog) {
               g_tlog = fopen("/tmp/pcsx_telemetry.log", "w");
               if (g_tlog) {
                fprintf(g_tlog, "=== PCSX-ReARMed V41 Audio Cushion Telemetry ===\\n");
                fflush(g_tlog);
               }
              }
             }
             g_before_feed_tv = now_tv;

             if (emu_us > 80000U) {
              /* Recovering from a level-load stall: refill ALSA cushion immediately */
              g_refill_frames = 22;
              for (int k = 0; k < 8; k++) g_emu_hist[k] = nom_us + 3500U;
             } else {
              uint32_t cl_emu = (emu_us > 52000U) ? 52000U : emu_us;
              g_emu_hist[g_hist_idx] = cl_emu;
              g_hist_idx = (g_hist_idx + 1) & 7;
             }

             uint32_t sum_emu = 0;
             for (int k = 0; k < 8; k++) sum_emu += g_emu_hist[k];
             uint32_t avg_emu_us = sum_emu >> 3;

             int n_out = n_in;
             if (avg_emu_us > nom_us - 600U || emu_us > nom_us + 1500U || g_last_feed_us < 1600U || g_refill_frames > 0) {
              uint32_t cl_cur = (emu_us > 52000U) ? 52000U : emu_us;
              uint32_t eff_us = avg_emu_us;
              if (cl_cur > avg_emu_us) {
               eff_us = (avg_emu_us * 5U + cl_cur * 3U) >> 3;
              }
              if (eff_us < nom_us) eff_us = nom_us;
              n_out = (int)(((uint64_t)eff_us * 44100ULL) / 1000000ULL);

              if (g_refill_frames > 0) {
               n_out += 88;
               g_refill_frames--;
              } else if (g_last_feed_us < 600U) {
               n_out += 64;
              } else if (g_last_feed_us < 1600U) {
               n_out += 28;
              }
              if (n_out < n_in) n_out = n_in;
              if (n_out > 2300) n_out = 2300;
             }

             if (n_out == n_in) {
              out_current->feed(spu.pSpuBuffer, bytes_to_feed);
             } else {
              const int16_t *src = (const int16_t *)spu.pSpuBuffer;
              if (n_in == 1) {
               for (int i = 0; i < n_out; i++) {
                g_stretch_buf[i * 2]     = src[0];
                g_stretch_buf[i * 2 + 1] = src[1];
               }
              } else {
               uint32_t step = ((uint32_t)(n_in - 1) << 16) / (uint32_t)(n_out - 1);
               uint32_t pos = 0;
               for (int i = 0; i < n_out - 1; i++) {
                uint32_t idx = pos >> 16;
                uint32_t frac = pos & 0xffffU;
                int32_t l0 = src[idx * 2],     r0 = src[idx * 2 + 1];
                int32_t l1 = src[idx * 2 + 2], r1 = src[idx * 2 + 3];
                g_stretch_buf[i * 2]     = (int16_t)(l0 + (((l1 - l0) * (int32_t)frac) >> 16));
                g_stretch_buf[i * 2 + 1] = (int16_t)(r0 + (((r1 - r0) * (int32_t)frac) >> 16));
                pos += step;
               }
               g_stretch_buf[(n_out - 1) * 2]     = src[(n_in - 1) * 2];
               g_stretch_buf[(n_out - 1) * 2 + 1] = src[(n_in - 1) * 2 + 1];
              }
              out_current->feed(g_stretch_buf, n_out << 2);
             }

             gettimeofday(&g_after_feed_tv, NULL);
             long f_us = (g_after_feed_tv.tv_sec - g_before_feed_tv.tv_sec) * 1000000L + (g_after_feed_tv.tv_usec - g_before_feed_tv.tv_usec);
             g_last_feed_us = (f_us > 0) ? (uint32_t)f_us : 0;

             g_sec_frames++;
             g_sec_in_samples += (uint32_t)n_in;
             g_sec_out_samples += (uint32_t)n_out;
             g_sec_emu_us += emu_us;
             g_sec_feed_us += g_last_feed_us;
             long sec_el = (g_after_feed_tv.tv_sec - g_sec_tv.tv_sec) * 1000000L + (g_after_feed_tv.tv_usec - g_sec_tv.tv_usec);
             if (sec_el >= 1000000L && g_sec_frames > 0) {
              if (g_tlog) {
               double fps = (double)g_sec_frames * 1000000.0 / (double)sec_el;
               fprintf(g_tlog, "[1S] %.1f fps | avg_emu=%u us avg_feed=%u us | samples/f: %u -> %u (total_out=%u/s) | xa=%d\\n",
                fps, (uint32_t)(g_sec_emu_us / g_sec_frames), (uint32_t)(g_sec_feed_us / g_sec_frames),
                g_sec_in_samples / g_sec_frames, g_sec_out_samples / g_sec_frames, g_sec_out_samples,
                (spu.XAPlay != spu.XAFeed) ? 1 : 0);
               fflush(g_tlog);
              }
              g_sec_tv = g_after_feed_tv;
              g_sec_frames = g_sec_in_samples = g_sec_out_samples = 0;
              g_sec_emu_us = g_sec_feed_us = 0;
             }
            }"""

          feed_pat = r'if\s*\(\s*flags\s*&\s*1\s*\)\s*\{\s*out_current->feed\(\s*spu\.pSpuBuffer,\s*\(unsigned char\s*\*\)\s*spu\.pS\s*-\s*spu\.pSpuBuffer\s*\);\s*spu\.pS\s*=\s*\(short\s*\*\)\s*spu\.pSpuBuffer;'
          spu_new = re.sub(feed_pat, new_feed, spu, count=1)
          assert spu_new != spu, "Could not find out_current->feed block in spu.c"
          spu = spu_header + spu_new

          xa_pat = r'FeedXA\(\s*xap\s*\);'
          new_xa = """if (spu.iLeftXAVol < 0x2000 && spu.iRightXAVol < 0x2000) { spu.iLeftXAVol = 0x7fff; spu.iRightXAVol = 0x7fff; }
           spu.spuCtrl |= 0xc001;
           FeedXA(xap);"""
          spu_new = re.sub(xa_pat, new_xa, spu, count=1)
          assert spu_new != spu, "Could not find FeedXA in spu.c"

          with open("plugins/dfsound/spu.c", "w") as f:
              f.write(spu_new)
          print("SUCCESS 2: Patched plugins/dfsound/spu.c with Post-Mix Audio Stretcher!")
          EOF

      - name: Compile PCSX-ReARMed V41 Core
        run: |
          make -f Makefile.libretro \
            platform=unix \
            ARCH=arm \
            CC=arm-linux-gnueabi-gcc \
            CXX=arm-linux-gnueabi-g++ \
            AS=arm-linux-gnueabi-as \
            DYNAREC=ari64 \
            BUILTIN_GPU=unai \
            HAVE_CHD=1 \
            HAVE_NEON=0 \
            HAVE_NEON_ASM=0 \
            -j$(nproc)
          ls -lh pcsx_rearmed_libretro.so

      - name: Upload V41 Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcsx_rearmed_libretro_v41
          path: pcsx_rearmed_libretro.so
