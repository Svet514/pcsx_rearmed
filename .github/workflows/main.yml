name: Build PCSX-ReARMed v31 Clean 46FPS-Lock + SesameLighting

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout b1226a3a & Apply Clean v31 Patches
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout b1226a3ab49a2e82e55a7123eb68fded56091044

          # 1. Add scph5502.bin to BIOS list
          sed -i 's/"scph5501.bin"/"scph5502.bin", "scph5501.bin"/g' frontend/libretro.c

          cat << 'EOF' > patch_v31.py
          import sys

          # --- 1. PATCH plugins/dfsound/spu.c: CONSTANT 768 (CUTSCENES) / 716 (~46 FPS GAMEPLAY) ---
          with open("plugins/dfsound/spu.c", "r") as f:
              spu_c = f.read()

          old_ns_calc = (
              " if (cycle_diff < 2 * 768)\n"
              "  return;\n"
              "\n"
              " ns_to = (cycle_diff / 768 + 1) & ~1;"
          )
          new_ns_calc = (
              " const int spu_div = (spu.XAPlay != spu.XAFeed) ? 768 : 716;\n"
              " if (cycle_diff < 2 * spu_div)\n"
              "  return;\n"
              "\n"
              " ns_to = (((spu.XAPlay != spu.XAFeed) ? (cycle_diff / 768) : (cycle_diff / 716)) + 1) & ~1;"
          )

          old_played_adv = "  spu.cycles_played += ns_to * 768;"
          new_played_adv = "  spu.cycles_played += ns_to * spu_div;"

          old_feed_xa = " FeedXA(xap);"
          new_feed_xa = "\n".join([
              " if (spu.iLeftXAVol < 0x2000 && spu.iRightXAVol < 0x2000) { spu.iLeftXAVol = 0x7fff; spu.iRightXAVol = 0x7fff; }",
              " spu.spuCtrl |= 0xc001;",
              " FeedXA(xap);"
          ])

          if old_ns_calc not in spu_c or old_played_adv not in spu_c or old_feed_xa not in spu_c:
              print("ERROR: target blocks not found in spu.c!")
              sys.exit(1)

          spu_c = (
              spu_c.replace(old_ns_calc, new_ns_calc, 1)
                   .replace(old_played_adv, new_played_adv, 1)
                   .replace(old_feed_xa, new_feed_xa, 1)
          )
          with open("plugins/dfsound/spu.c", "w") as f:
              f.write(spu_c)
          print("SUCCESS 1: Patched spu.c with constant 716 (~46 FPS) / 768 (XA cutscenes)!")

          # --- 2. PATCH libpcsxcore/cdrom.c: CLEAN CHANNEL 255 FIRST-SECTOR LOCK FIX ---
          with open("libpcsxcore/cdrom.c", "r") as f:
              cdrom = f.read()

          old_lock = (
              "\t\tif( cdr.FirstSector == 1 && (cdr.Mode & MODE_SF)==0 ) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t}"
          )
          new_lock = (
              "\t\tif (cdr.FirstSector == 1 && (cdr.Mode & MODE_SF) == 0 && (cdr.Transfer[4 + 2] & 0x4) && cdr.Transfer[4 + 1] != 255) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t}"
          )

          if old_lock not in cdrom:
              print("ERROR: old_lock not found in cdrom.c!")
              sys.exit(1)

          cdrom = cdrom.replace(old_lock, new_lock, 1)
          with open("libpcsxcore/cdrom.c", "w") as f:
              f.write(cdrom)
          print("SUCCESS 2: Cleanly patched libpcsxcore/cdrom.c!")

          # --- 3. PATCH frontend/libretro.c: AUTO-DISABLE LIGHTING FOR 'Sesame Street Sports' VIA CdromId / Title ---
          with open("frontend/libretro.c", "r") as f:
              libretro_c = f.read()

          target_lighting_block = (
              '   var.key = "pcsx_rearmed_gpu_unai_lighting";\n'
              '   var.value = NULL;\n'
              '\n'
              '   if (environ_cb(RETRO_ENVIRONMENT_GET_VARIABLE, &var) && var.value)\n'
              '   {\n'
              '      if (strcmp(var.value, "disabled") == 0)\n'
              '         pl_rearmed_cbs.gpu_unai.lighting = 0;\n'
              '      else if (strcmp(var.value, "enabled") == 0)\n'
              '         pl_rearmed_cbs.gpu_unai.lighting = 1;\n'
              '   }'
          )

          if target_lighting_block not in libretro_c:
              print("ERROR: target_lighting_block not found in frontend/libretro.c!")
              sys.exit(1)

          new_lighting_block = "\n".join([
              '   var.key = "pcsx_rearmed_gpu_unai_lighting";',
              '   var.value = NULL;',
              '',
              '   if (environ_cb(RETRO_ENVIRONMENT_GET_VARIABLE, &var) && var.value)',
              '   {',
              '      if (strcmp(var.value, "disabled") == 0)',
              '         pl_rearmed_cbs.gpu_unai.lighting = 0;',
              '      else if (strcmp(var.value, "enabled") == 0)',
              '         pl_rearmed_cbs.gpu_unai.lighting = 1;',
              '   }',
              '   /* Auto-disable lighting for Sesame Street Sports (SLES03180 / SLUS01180 or ID check) */',
              '   if (strncasecmp(CdromId, "sles03180", 9) == 0 || strncasecmp(CdromId, "slus01180", 9) == 0 || strcasestr(CdromId, "sesame") != NULL)',
              '      pl_rearmed_cbs.gpu_unai.lighting = 0;'
          ])

          libretro_c = libretro_c.replace(target_lighting_block, new_lighting_block, 1)

          with open("frontend/libretro.c", "w") as f:
              f.write(libretro_c)
          print("SUCCESS 3: Patched frontend/libretro.c with safe CdromId auto-lighting override for Sesame Street Sports!")
          EOF

          python3 patch_v31.py | tee ../build_v31_report.txt
          rm -f patch_v31.py

          # Optimize Makefiles
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile

          echo "=== VERIFIED GIT DIFF FOR V31 ===" >> ../build_v31_report.txt
          git diff frontend/libretro.c libpcsxcore/cdrom.c plugins/dfsound/spu.c >> ../build_v31_report.txt

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            A9_V31_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -funroll-loops -fpeel-loops -ftracer -fno-tree-vectorize -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fgcse-sm -fgcse-las -fipa-pta -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$A9_V31_FLAGS"
            export CXXFLAGS="$A9_V31_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $A9_V31_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $A9_V31_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_v31.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
            ls -lh ../pcsx_rearmed_libretro.so >> ../build_v31_report.txt
          '
          cat build_v31_report.txt

      - name: Upload v31 .so File & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-v31-clean-46fps-sesame
          path: |
            pcsx_rearmed_libretro.so
            build_v31_report.txt
            build_v31.log
