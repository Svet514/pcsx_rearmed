name: Build PCSX-ReARMed v25 MovieSync + CatAudioAutoFix + XAPeakLogger

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Official b1226a3a & Apply v25 Patches
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout b1226a3ab49a2e82e55a7123eb68fded56091044

          # 1. Add scph5502.bin to BIOS list
          sed -i 's/"scph5501.bin"/"scph5502.bin", "scph5501.bin"/g' frontend/libretro.c

          cat << 'EOF' > patch_v25.py
          import sys

          with open("plugins/dfsound/spu.c", "r") as f:
              spu_c = f.read()

          # Print lines 450-660 of spu.c (MixXA / FeedXA) into report
          print("=== SPU.C LINES 450-660 (MixXA & FeedXA) ===")
          print("\n".join(spu_c.splitlines()[450:660]))

          # --- 1. PATCH plugins/dfsound/spu.c: 768 DURING MOVIES + 824/748 IN GAMEPLAY + ENSURE XA VOLUME NOT 0 ---
          spu_c = "#include <sys/time.h>\nstatic int g_spu_div = 768;\n" + spu_c

          old_ns_calc = (
              " if (cycle_diff < 2 * 768)\n"
              "  return;\n"
              "\n"
              " ns_to = (cycle_diff / 768 + 1) & ~1;"
          )
          new_ns_calc = (
              " if (cycle_diff < 2 * g_spu_div)\n"
              "  return;\n"
              "\n"
              " ns_to = (cycle_diff / g_spu_div + 1) & ~1;"
          )

          old_played_adv = "  spu.cycles_played += ns_to * 768;"
          new_played_adv = "  spu.cycles_played += ns_to * g_spu_div;"

          old_async_feed = (
              " if (flags & 1) {\n"
              "  out_current->feed(spu.pSpuBuffer, (unsigned char *)spu.pS - spu.pSpuBuffer);\n"
              "  spu.pS = (short *)spu.pSpuBuffer;"
          )
          new_async_feed = "\n".join([
              " if (flags & 1) {",
              "  static struct timeval after_feed_tv = {0, 0};",
              "  struct timeval before_feed_tv;",
              "  gettimeofday(&before_feed_tv, NULL);",
              "  if (spu.XAPlay != spu.XAFeed) {",
              "   g_spu_div = 768;",
              "  } else if (after_feed_tv.tv_sec != 0) {",
              "   long emu_us = (before_feed_tv.tv_sec - after_feed_tv.tv_sec) * 1000000L + (before_feed_tv.tv_usec - after_feed_tv.tv_usec);",
              "   if (emu_us > 21200) g_spu_div = 748;",
              "   else if (emu_us > 19600) g_spu_div = 784;",
              "   else g_spu_div = 824;",
              "  }",
              "  out_current->feed(spu.pSpuBuffer, (unsigned char *)spu.pS - spu.pSpuBuffer);",
              "  spu.pS = (short *)spu.pSpuBuffer;",
              "  gettimeofday(&after_feed_tv, NULL);"
          ])

          # Also check SPUplayADPCMchannel in spu.c to log spuCtrl and iLeftXAVol/iRightXAVol and auto-unmute if 0!
          old_play_adpcm = "void CALLBACK SPUplayADPCMchannel(xa_decode_t *xap, unsigned int cycle, int is_direct)\n{"
          new_play_adpcm = "\n".join([
              "void CALLBACK SPUplayADPCMchannel(xa_decode_t *xap, unsigned int cycle, int is_direct)",
              "{",
              " if (spu.iLeftXAVol == 0 && spu.iRightXAVol == 0) {",
              "  spu.iLeftXAVol = 0x7fff;",
              "  spu.iRightXAVol = 0x7fff;",
              " }",
              " {",
              "  static int spu_xa_log = 0;",
              "  if (spu_xa_log < 80) {",
              "   int max_v = 0;",
              "   int tot = xap->nsamples * (xap->stereo ? 2 : 1);",
              "   for (int i = 0; i < tot; i++) { int v = xap->pcm[i]; if (v < 0) v = -v; if (v > max_v) max_v = v; }",
              "   FILE *fp = fopen(\"/tmp/cat_trace.log\", \"a\");",
              "   if (fp) { fprintf(fp, \"SPU_XA: max_pcm=%d Vol=%04x:%04x Ctrl=%04x Stat=%04x Play=%d Feed=%d%c\", max_v, spu.iLeftXAVol, spu.iRightXAVol, spu.spuCtrl, spu.spuStat, (int)(spu.XAPlay - spu.XAStart), (int)(spu.XAFeed - spu.XAStart), 10); fclose(fp); }",
              "   spu_xa_log++;",
              "  }",
              " }"
          ])

          if old_ns_calc not in spu_c or old_played_adv not in spu_c or old_async_feed not in spu_c or old_play_adpcm not in spu_c:
              print("ERROR: target blocks not found in spu.c!")
              sys.exit(1)

          spu_c = (
              spu_c.replace(old_ns_calc, new_ns_calc, 1)
                   .replace(old_played_adv, new_played_adv, 1)
                   .replace(old_async_feed, new_async_feed, 1)
                   .replace(old_play_adpcm, new_play_adpcm, 1)
          )
          with open("plugins/dfsound/spu.c", "w") as f:
              f.write(spu_c)
          print("SUCCESS 1: Patched spu.c with SPU_XA amplitude/volume logger + auto-unmute!")

          # --- 2. PATCH libpcsxcore/cdrom.c: INSPECT BOTH CH 1 AND CH 255 AMPLITUDE AT 05:28:72! ---
          with open("libpcsxcore/cdrom.c", "r") as f:
              cdrom = f.read()

          print("=== CDROM.C LINES 1050-1155 ===")
          print("\n".join(cdrom.splitlines()[1050:1155]))

          old_cdxa_block = (
              "\tif ((!cdr.Muted) && (cdr.Mode & MODE_STRSND) && (!Config.Xa) && (cdr.FirstSector != -1)) { // CD-XA\n"
              "\t\t// Firemen 2: Multi-XA files - briefings, cutscenes\n"
              "\t\tif( cdr.FirstSector == 1 && (cdr.Mode & MODE_SF)==0 ) {\n"
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];\n"
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];\n"
              "\t\t}\n"
              "\n"
              "\t\t/* Gameblabla \n"
              "\t\t * Skips playing on channel 255.\n"
              "\t\t * Fixes missing audio in Blue's Clues : Blue's Big Musical. (Should also fix Taxi 2)\n"
              "\t\t * TODO : Check if this is the proper behaviour.\n"
              "\t\t * */\n"
              "\t\tif((cdr.Transfer[4 + 2] & 0x4) &&\n"
              "\t\t\t (cdr.Transfer[4 + 1] == cdr.Channel) &&\n"
              "\t\t\t (cdr.Transfer[4 + 0] == cdr.File) && cdr.Channel != 255) {\n"
              "\t\t\tint ret = xa_decode_sector(&cdr.Xa, cdr.Transfer+4, cdr.FirstSector);\n"
              "\t\t\tif (!ret) {\n"
              "\t\t\t\tcdrAttenuate(cdr.Xa.pcm, cdr.Xa.nsamples, cdr.Xa.stereo);\n"
              "\t\t\t\tSPU_playADPCMchannel(&cdr.Xa);\n"
              "\t\t\t\tcdr.FirstSector = 0;\n"
              "\t\t\t}\n"
              "\t\t\telse cdr.FirstSector = -1;\n"
              "\t\t}\n"
              "\t}"
          )

          new_cdxa_block = "\n".join([
              "\tif ((!cdr.Muted) && (cdr.Mode & MODE_STRSND) && (!Config.Xa) && (cdr.FirstSector != -1)) { // CD-XA",
              "\t\tif (cdr.FirstSector == 1 && (cdr.Mode & MODE_SF) == 0 && (cdr.Transfer[4 + 2] & 0x4) && cdr.Transfer[4 + 1] != 255) {",
              "\t\t\tcdr.File = cdr.Transfer[4 + 0];",
              "\t\t\tcdr.Channel = cdr.Transfer[4 + 1];",
              "\t\t}",
              "\t\tif (cdr.Transfer[0] == 0x05 && (cdr.Transfer[4 + 2] & 0x4)) {",
              "\t\t\tstatic int m05_xa_log = 0;",
              "\t\t\tif (m05_xa_log < 60) {",
              "\t\t\t\txa_decode_t tmp_xa;",
              "\t\t\t\tmemset(&tmp_xa, 0, sizeof(tmp_xa));",
              "\t\t\t\tint tret = xa_decode_sector(&tmp_xa, cdr.Transfer+4, 1);",
              "\t\t\t\tint tmax = 0;",
              "\t\t\t\tfor (int i = 0; i < tmp_xa.nsamples * 2; i++) { int v = tmp_xa.pcm[i]; if (v < 0) v = -v; if (v > tmax) tmax = v; }",
              "\t\t\t\tFILE *fp = fopen(\"/tmp/cat_trace.log\", \"a\");",
              "\t\t\t\tif (fp) { fprintf(fp, \"M05_CHK: %02x:%02x:%02x Sec=%d:%d Sub=%02x Cod=%02x tret=%d tmax=%d Att=%d:%d%c\", cdr.Transfer[0], cdr.Transfer[1], cdr.Transfer[2], cdr.Transfer[4+0], cdr.Transfer[4+1], cdr.Transfer[4+2], cdr.Transfer[4+3], tret, tmax, cdr.AttenuatorLeftToLeft, cdr.AttenuatorRightToRight, 10); fclose(fp); }",
              "\t\t\t\tm05_xa_log++;",
              "\t\t\t}",
              "\t\t}",
              "\t\tif ((cdr.Transfer[4 + 2] & 0x4) &&",
              "\t\t    (cdr.Transfer[4 + 1] == cdr.Channel) &&",
              "\t\t    (cdr.Transfer[4 + 0] == cdr.File) && cdr.Channel != 255) {",
              "\t\t\tint ret = xa_decode_sector(&cdr.Xa, cdr.Transfer+4, cdr.FirstSector);",
              "\t\t\tif (!ret) {",
              "\t\t\t\tcdrAttenuate(cdr.Xa.pcm, cdr.Xa.nsamples, cdr.Xa.stereo);",
              "\t\t\t\tSPU_playADPCMchannel(&cdr.Xa);",
              "\t\t\t\tcdr.FirstSector = 0;",
              "\t\t\t}",
              "\t\t\telse cdr.FirstSector = -1;",
              "\t\t}",
              "\t}"
          ])

          if old_cdxa_block not in cdrom:
              print("ERROR: old_cdxa_block not found in cdrom.c!")
              sys.exit(1)

          cdrom = cdrom.replace(old_cdxa_block, new_cdxa_block, 1)
          with open("libpcsxcore/cdrom.c", "w") as f:
              f.write(cdrom)
          print("SUCCESS 2: Patched libpcsxcore/cdrom.c with M05_CHK peak detector!")
          EOF

          python3 patch_v25.py > ../build_v25_report.txt
          rm -f patch_v25.py

          # Optimize Makefiles
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile

          echo "=== VERIFIED GIT DIFF FOR V25 ===" >> ../build_v25_report.txt
          git diff libpcsxcore/cdrom.c plugins/dfsound/spu.c >> ../build_v25_report.txt

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            A9_V25_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -funroll-loops -fpeel-loops -ftracer -fno-tree-vectorize -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fgcse-sm -fgcse-las -fipa-pta -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$A9_V25_FLAGS"
            export CXXFLAGS="$A9_V25_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $A9_V25_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $A9_V25_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_v25.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
            ls -lh ../pcsx_rearmed_libretro.so >> ../build_v25_report.txt
          '
          cat build_v25_report.txt

      - name: Upload v25 .so File & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-v25-moviesync-xapeak
          path: |
            pcsx_rearmed_libretro.so
            build_v25_report.txt
            build_v25.log
