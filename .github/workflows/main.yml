name: Build PCSX-ReARMed v13 Clean-Speech + Full-FastLight + CD-Logger

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Official b1226a3a (Clean Speech) & Patch Fast Lighting
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout b1226a3ab49a2e82e55a7123eb68fded56091044

          # 1. Add scph5502.bin to BIOS list
          sed -i 's/"scph5501.bin"/"scph5502.bin", "scph5501.bin"/g' frontend/libretro.c

          cat << 'EOF' > patch_v13.py
          import re
          import sys

          # --- 1. INSPECT gpu_inner.h TO SEE HOW LIGHTING & BLENDING ARE CALLED ---
          with open("plugins/gpu_unai/gpu_inner.h", "r") as f:
              inner_h = f.read()
          print("=== GPU_INNER.H LINES 1-140 ===")
          print("\n".join(inner_h.splitlines()[:140]))

          # --- 2. PATCH ALL 4 LIGHTING FUNCTIONS IN gpu_inner_light.h WITH 1-CYCLE NEUTRAL-LIGHT SKIP ---
          with open("plugins/gpu_unai/gpu_inner_light.h", "r") as f:
              light_h = f.read()

          # Fast skip when r5==15, g5==15, b5==15 (neutral light = unmodified texture color)
          light_h = light_h.replace(
              "GPU_INLINE uint_fast16_t gpuLightingTXTGeneric(uint_fast16_t uSrc, u8 r5, u8 g5, u8 b5)\n{",
              "GPU_INLINE uint_fast16_t gpuLightingTXTGeneric(uint_fast16_t uSrc, u8 r5, u8 g5, u8 b5)\n{\n\tif (((r5 ^ 0x0F) | (g5 ^ 0x0F) | (b5 ^ 0x0F)) == 0) return uSrc & 0x7FFF;",
              1
          )
          light_h = light_h.replace(
              "GPU_INLINE uint_fast16_t gpuLightingTXTGouraudGeneric(uint_fast16_t uSrc, u32 gCol)\n{",
              "GPU_INLINE uint_fast16_t gpuLightingTXTGouraudGeneric(uint_fast16_t uSrc, u32 gCol)\n{\n\tif (((gCol ^ 0x780F01E0) & 0xF81F03E0) == 0) return uSrc & 0x7FFF;",
              1
          )
          light_h = light_h.replace(
              "GPU_INLINE u32 gpuLightingTXT24(uint_fast16_t uSrc, u8 r8, u8 g8, u8 b8)\n{",
              "GPU_INLINE u32 gpuLightingTXT24(uint_fast16_t uSrc, u8 r8, u8 g8, u8 b8)\n{\n\tif (((r8 ^ 0x7F) | (g8 ^ 0x7F) | (b8 ^ 0x7F)) < 4) return ((uSrc & 0x7C00) << 14) | ((uSrc & 0x03E0) << 9) | ((uSrc & 0x001F) << 4);",
              1
          )
          light_h = light_h.replace(
              "GPU_INLINE u32 gpuLightingTXT24Gouraud(uint_fast16_t uSrc, u32 gCol)\n{",
              "GPU_INLINE u32 gpuLightingTXT24Gouraud(uint_fast16_t uSrc, u32 gCol)\n{\n\tif (((gCol ^ 0x7F0FC1FC) & 0xF81F03E0) == 0) return ((uSrc & 0x7C00) << 14) | ((uSrc & 0x03E0) << 9) | ((uSrc & 0x001F) << 4);",
              1
          )

          with open("plugins/gpu_unai/gpu_inner_light.h", "w") as f:
              f.write(light_h)
          print("SUCCESS 1: Patched all 4 lighting functions in gpu_inner_light.h!")

          # --- 3. KEEP OFFICIAL b1226a3a CD-XA LOGIC 100% INTACT (NO SPEECH CUTOFFS!) + ADD READ-ONLY /tmp/cdxa.log TRACER ---
          with open("libpcsxcore/cdrom.c", "r") as f:
              cdrom = f.read()

          # Add a read-only logger when XA sectors are evaluated so we can see why the Cat cutscene is silent without altering playback!
          old_xa_check = "if ((!cdr.Muted) && (cdr.Mode & MODE_STRSND) && (!Config.Xa) && (cdr.FirstSector != -1)) { // CD-XA"
          new_xa_check = "\n".join([
              "if (cdr.Transfer[4 + 2] & 0x4) {",
              "\t\tstatic int xa_log_lines = 0;",
              "\t\tstatic int last_logged_chan = -2;",
              "\t\tif (xa_log_lines < 150 && (cdr.Transfer[4 + 1] != last_logged_chan || cdr.FirstSector != 0)) {",
              "\t\t\tFILE *fp = fopen(\"/tmp/cdxa.log\", \"a\");",
              "\t\t\tif (fp) {",
              "\t\t\t\tfprintf(fp, \"XA_SEC: Muted=%d Mode=%02x First=%d Flt=%d:%d Sec=%d:%d Sub=%02x Cod=%02x%c\", cdr.Muted, cdr.Mode, cdr.FirstSector, cdr.File, cdr.Channel, cdr.Transfer[4+0], cdr.Transfer[4+1], cdr.Transfer[4+2], cdr.Transfer[4+3], 10);",
              "\t\t\t\tfclose(fp);",
              "\t\t\t}",
              "\t\t\tlast_logged_chan = cdr.Transfer[4 + 1];",
              "\t\t\txa_log_lines++;",
              "\t\t}",
              "\t}",
              "\tif ((!cdr.Muted) && (cdr.Mode & MODE_STRSND) && (!Config.Xa) && (cdr.FirstSector != -1)) { // CD-XA"
          ])

          if old_xa_check not in cdrom:
              print("ERROR: old_xa_check not found in cdrom.c!")
              sys.exit(1)

          cdrom = cdrom.replace(old_xa_check, new_xa_check, 1)
          with open("libpcsxcore/cdrom.c", "w") as f:
              f.write(cdrom)
          print("SUCCESS 2: Kept official b1226a3a CD-XA speech logic + added read-only /tmp/cdxa.log tracer!")
          EOF

          python3 patch_v13.py > ../build_v13_report.txt
          rm -f patch_v13.py

          # 3. Optimize Makefiles
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -Wl,-Bsymbolic -Wl,-Bsymbolic-functions -static-libstdc++ -static-libgcc/g' Makefile

          echo "=== VERIFIED GIT DIFF FOR V13 ===" >> ../build_v13_report.txt
          git diff frontend/libretro.c libpcsxcore/cdrom.c plugins/gpu_unai/gpu_inner_light.h >> ../build_v13_report.txt

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            A9_V13_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -mno-unaligned-access -O3 -fno-tree-vectorize -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -fgcse-sm -fgcse-las -fipa-pta -fno-plt -fno-semantic-interposition -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$A9_V13_FLAGS"
            export CXXFLAGS="$A9_V13_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $A9_V13_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $A9_V13_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_v13.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
            ls -lh ../pcsx_rearmed_libretro.so >> ../build_v13_report.txt
          '
          cat build_v13_report.txt

      - name: Upload v13 .so File & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-v13-cleanspeech
          path: |
            pcsx_rearmed_libretro.so
            build_v13_report.txt
            build_v13.log
