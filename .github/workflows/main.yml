name: Build PCSX-ReARMed Ultimate + Exact Blues Clues Fix v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout d2b40c8 & Patch Exact cdrom.c Lines
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git src
          cd src
          git checkout d2b40c8
          git submodule update --init

          cat << 'EOF' > patch_cdrom.py
          with open("libpcsxcore/cdrom.c", "r") as f:
              code = f.read()

          # Exact block from d2b40c8 (verified from blues_clues_cdrom_report.txt)
          exact_old_block = """\tif ((!cdr.Muted) && (cdr.Mode & MODE_STRSND) && (!Config.Xa) && (cdr.FirstSector != -1)) { // CD-XA
\t\t// Firemen 2: Multi-XA files - briefings, cutscenes
\t\tif( cdr.FirstSector == 1 && (cdr.Mode & MODE_SF)==0 ) {
\t\t\tcdr.File = cdr.Transfer[4 + 0];
\t\t\tcdr.Channel = cdr.Transfer[4 + 1];
\t\t}

\t\tif((cdr.Transfer[4 + 2] & 0x4) &&
\t\t\t (cdr.Transfer[4 + 1] == cdr.Channel) &&
\t\t\t (cdr.Transfer[4 + 0] == cdr.File)) {
\t\t\tint ret = xa_decode_sector(&cdr.Xa, cdr.Transfer+4, cdr.FirstSector);
\t\t\tif (!ret) {
\t\t\t\tcdrAttenuate(cdr.Xa.pcm, cdr.Xa.nsamples, cdr.Xa.stereo);
\t\t\t\tSPU_playADPCMchannel(&cdr.Xa);
\t\t\t\tcdr.FirstSector = 0;
\t\t\t}
\t\t\telse cdr.FirstSector = -1;
\t\t}
\t}"""

          # Patched block:
          # 1. Ignores channel 255 (0xff) sectors completely so they never lock cdr.Channel or set FirstSector = -1
          # 2. If cdr.Channel was set to 0xff (255) by the game or FirstSector==1, locks onto the first valid audio sector (cdr.Transfer[4+2] & 0x4)
          # 3. Does not kill the stream with cdr.FirstSector = -1 on a rejected sector
          exact_new_block = """\tif ((!cdr.Muted) && (cdr.Mode & MODE_STRSND) && (!Config.Xa) && (cdr.FirstSector != -1)) { // CD-XA
\t\t// Firemen 2 & Blue's Clues: Multi-XA files & Channel 255 fix
\t\tif ((cdr.Transfer[4 + 2] & 0x4) && (cdr.Transfer[4 + 1] != 0xff)) {
\t\t\tif ((cdr.FirstSector == 1 && (cdr.Mode & MODE_SF) == 0) || cdr.Channel == 0xff) {
\t\t\t\tcdr.File = cdr.Transfer[4 + 0];
\t\t\t\tcdr.Channel = cdr.Transfer[4 + 1];
\t\t\t}
\t\t\tif ((cdr.Transfer[4 + 1] == cdr.Channel) &&
\t\t\t    (cdr.Transfer[4 + 0] == cdr.File)) {
\t\t\t\tint ret = xa_decode_sector(&cdr.Xa, cdr.Transfer+4, cdr.FirstSector);
\t\t\t\tif (!ret) {
\t\t\t\t\tcdrAttenuate(cdr.Xa.pcm, cdr.Xa.nsamples, cdr.Xa.stereo);
\t\t\t\t\tSPU_playADPCMchannel(&cdr.Xa);
\t\t\t\t\tcdr.FirstSector = 0;
\t\t\t\t}
\t\t\t}
\t\t}
\t}"""

          if exact_old_block in code:
              code = code.replace(exact_old_block, exact_new_block, 1)
              print("SUCCESS: Replaced exact CD-XA block in libpcsxcore/cdrom.c!")
          else:
              print("ERROR: Exact block not found!")
              exit(1)

          with open("libpcsxcore/cdrom.c", "w") as f:
              f.write(code)
          EOF

          python3 patch_cdrom.py > ../blues_clues_v3_report.txt
          rm -f patch_cdrom.py

          echo "=== VERIFY GIT DIFF ON CDROM.C ===" >> ../blues_clues_v3_report.txt
          git diff >> ../blues_clues_v3_report.txt

          # 1. Force -O3 everywhere
          sed -i 's/-O2/-O3/g' Makefile.libretro
          sed -i 's/-O2/-O3/g' Makefile

          # 2. Statically link libstdc++ and libgcc
          sed -i 's/-shared/-shared -static-libstdc++ -static-libgcc/g' Makefile.libretro
          sed -i 's/-shared/-shared -static-libstdc++ -static-libgcc/g' Makefile

      - name: Compile Inside Ubuntu 18.04 Container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -e -c '
            apt-get update
            apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make binutils

            cd /work/src
            find . -name "*.o" -delete
            rm -f pcsx_rearmed_libretro.so

            ULTIMATE_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -munaligned-access -O3 -funroll-loops -fpeel-loops -ftracer -fomit-frame-pointer -ffast-math -funsafe-math-optimizations -fstrict-aliasing -ftree-vectorize -fprefetch-loop-arrays --param l1-cache-size=32 --param l1-cache-line-size=32 --param l2-cache-size=128 -fno-plt -fno-semantic-interposition -fgcse-sm -fgcse-las -fipa-pta -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector -DNDEBUG"
            ASM_FLAGS="-march=armv7-a -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp"

            export CFLAGS="$ULTIMATE_FLAGS"
            export CXXFLAGS="$ULTIMATE_FLAGS"
            export ASFLAGS="$ASM_FLAGS"

            make -f Makefile.libretro \
              platform=unix ARCH=arm DYNAREC=ari64 HAVE_NEON=0 HAVE_VFP=1 HAVE_CHD=1 THREAD_RENDERING=0 BUILTIN_GPU=unai \
              CC="arm-linux-gnueabi-gcc $ULTIMATE_FLAGS" \
              CXX="arm-linux-gnueabi-g++ $ULTIMATE_FLAGS -static-libstdc++ -static-libgcc" \
              AS="arm-linux-gnueabi-as $ASM_FLAGS" \
              AR=arm-linux-gnueabi-ar -j2 2>&1 | tee ../build_blues_clues_v3.log

            arm-linux-gnueabi-strip --strip-unneeded pcsx_rearmed_libretro.so
            cp pcsx_rearmed_libretro.so ../pcsx_rearmed_libretro.so
          '
          cat blues_clues_v3_report.txt

      - name: Upload Ready-to-Use .so File & v3 Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearmed-blues-clues-v3
          path: |
            pcsx_rearmed_libretro.so
            blues_clues_v3_report.txt
            build_blues_clues_v3.log
